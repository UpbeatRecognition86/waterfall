    const s=`<circle r="${r}" cx="70" cy="70" fill="none" stroke="${catColor(c.category)}" stroke-width="${focus&&c.category===focus?23:20}"
      opacity="${dim?0.28:1}" stroke-dasharray="${len.toFixed(2)} ${(C-len).toFixed(2)}" stroke-dashoffset="${(-off).toFixed(2)}"
      transform="rotate(-90 70 70)"></circle>`; off+=len; return s; }).join("");
  const fc=focus?cats.find(c=>c.category===focus):null;
  const center = fc
    ? `<text x="70" y="64" text-anchor="middle" font-family="var(--sans)" font-size="20" font-weight="800" fill="${catColor(fc.category)}">${Math.round(fc.amount/total*100)}%</text>
       <text x="70" y="83" text-anchor="middle" font-family="var(--sans)" font-size="9.5" fill="var(--ink-faint)">${esc(fc.category).slice(0,15)}</text>`
    : `<text x="70" y="66" text-anchor="middle" font-family="var(--sans)" font-size="17" font-weight="800" fill="var(--ink)">${compact(total)}</text>
       <text x="70" y="84" text-anchor="middle" font-family="var(--sans)" font-size="10" fill="var(--ink-faint)">spent</text>`;
  const legend=cats.map(c=>{ const pct=(c.amount/total*100); return `<button class="legrow${focus===c.category?' on':''}" data-donut="${esc(c.category)}">
      <span class="dotc" style="background:${catColor(c.category)}"></span>
      <span class="legname">${esc(c.category)}</span>
      <span class="legpct mono">${pct.toFixed(pct<10?1:0)}%</span>
      <span class="legamt mono">${inr(c.amount)}</span></button>`; }).join("");
  return `<div class="donutwrap">
      <svg width="140" height="140" viewBox="0 0 140 140">${segs}
        <circle r="40" cx="70" cy="70" fill="var(--surface)"></circle>${center}</svg>
      <div class="legend">${legend}</div></div>`;
}
const DEFAULT_CATS=["Food & Dining","Travel & Transport","Groceries","Shopping","Bills & Subscriptions","Health","Entertainment","Payment / Transfer","Other"];
function knownCategories(){
  const set=new Set(DEFAULT_CATS);
  Object.values(state.merchantMaster||{}).forEach(c=>set.add(c));
  Object.values(state.spending||{}).forEach(m=>(m.transactions||[]).forEach(t=>set.add(t.category)));
  return [...set];
}
/* detect fixed bills that also appear on the card statement (double-count risk) */
function billOverlaps(period){
  const sp=(state.spending||{})[period]; if(!sp) return [];
  const out=[];
  (state.fixed||[]).forEach(fb=>{
    const name=String(fb.name||"").toLowerCase().trim(), amt=Number(fb.amount)||0;
    if(name.length<3) return;
    const hit=(sp.transactions||[]).find(t=>t.type==="debit" && (
      String(t.merchant||"").toLowerCase().includes(name) ||
      (amt>0 && Math.abs((t.amount||0)-amt)<=Math.max(50, amt*0.05) && /bill|subscription|recharge/i.test((t.category||"")+" "+(t.merchant||"")))
    ));
    if(hit) out.push({fixed:fb.name, merchant:hit.merchant, amount:hit.amount});
  });
  return out;
}

/* lazy-load pdf.js only when a statement is uploaded (keeps core app offline) */
let _pdfjs=null;
async function loadPdfjs(){
  if(_pdfjs) return _pdfjs;
  const m=await import("https://cdn.jsdelivr.net/npm/pdfjs-dist@4.7.76/build/pdf.min.mjs");
  m.GlobalWorkerOptions.workerSrc="https://cdn.jsdelivr.net/npm/pdfjs-dist@4.7.76/build/pdf.worker.min.mjs";
  _pdfjs=m; return m;
}
function explodeItem(it){
  // split a pdf.js text run into word-tokens with estimated x, to mirror pdfplumber granularity
  const s=it.str; const out=[]; const x0=it.transform[4], W=it.width||0, n=s.length||1;
  let i=0; const re=/\S+/g; let mm;
  while((mm=re.exec(s))){ out.push({text:mm[0], x:x0 + W*(mm.index/n), w:W*(mm[0].length/n), _y:it.transform[5]}); }
  return out;
}
async function pdfToPages(file){
  const pdfjs=await loadPdfjs();
  let pdf, pw="";
  for(let attempt=0; attempt<4; attempt++){
    try{ const data=new Uint8Array(await file.arrayBuffer()); pdf=await pdfjs.getDocument({data, password:pw}).promise; break; }
    catch(e){ if(e && e.name==="PasswordException" && attempt<3){ pw=prompt(`"${file.name}" is password-protected. Enter its password:`)||""; }
      else throw e; }
  }
  const pages=[];
  for(let p=1;p<=pdf.numPages;p++){
    const page=await pdf.getPage(p); const vp=page.getViewport({scale:1});
    const tc=await page.getTextContent();
    const words=[];
    tc.items.forEach(it=>{ if(!it.str||!it.str.trim()) return;
      explodeItem(it).forEach(t=>words.push({text:t.text, x:t.x, y:vp.height - t._y, w:t.w})); });
    pages.push({width:vp.width, height:vp.height, words});
  }
  return pages;
}

let parsing=false;
/* Distribute transactions into their OWN month/year buckets (a statement can span
   two months), de-duping on date+merchant+amount. Returns {added,dupes,months}. */
function ingestTransactions(txns, file, bank){
  let added=0, dupes=0; const touched=new Set();
  (txns||[]).forEach(t=>{
    if(!t || !(t.amount>0)) return;
    t.bank = t.bank || bank;
    const period = /^\d{4}-\d{2}/.test(t.date||"") ? t.date.slice(0,7) : activePeriod;
    const bucket = state.spending[period] || {transactions:[], sources:[], total:0};
    const dup = bucket.transactions.some(x=>x.date===t.date && x.amount===t.amount && String(x.merchant||"")===String(t.merchant||""));
    if(dup){ dupes++; return; }
    bucket.transactions.push(t);
    let src=(bucket.sources=bucket.sources||[]).find(s=>s.file===file && s.bank===t.bank);
    if(!src){ src={bank:t.bank, file, count:0, spend:0, period}; bucket.sources.push(src); }
    src.count++; if(t.type==="debit") src.spend += t.amount;
    bucket.total = bucket.transactions.filter(x=>x.type==="debit").reduce((a,x)=>a+x.amount,0);
    state.spending[period]=bucket; touched.add(period); added++;
  });
  return {added, dupes, months:[...touched].sort()};
}
async function handleStatements(fileList){
  const files=[...fileList]; if(!files.length) return;
  parsing=true; render();
  let added=0, dupes=0, failed=[]; const touched=new Set();
  for(const file of files){
    try{
      const pages=await pdfToPages(file);
      const res=WaterfallParser.parseStatement(pages,{master:state.merchantMaster});
      if(!res.bank || !res.transactions.length){ failed.push(file.name+" (unrecognised)"); continue; }
      res.transactions.forEach(t=>t.bank=res.bank);
      const r=ingestTransactions(res.transactions, file.name, res.bank);
      added+=r.added; dupes+=r.dupes; r.months.forEach(m=>touched.add(m));
    }catch(e){ failed.push(file.name+" ("+(e&&e.message||"error")+")"); }
  }
  if(touched.size){ activePeriod=[...touched].sort().pop(); }   // jump to the most recent month that landed
  parsing=false; persist(); render();
  toast(added?`Added ${added} transactions across ${touched.size} month${touched.size>1?'s':''}${dupes?` · ${dupes} duplicates skipped`:''}`:(dupes?"Already added — nothing new":"Nothing parsed"));
  if(failed.length) setTimeout(()=>alert("Could not parse:\n• "+failed.join("\n• ")),300);
}

/* ---------- CSV import (bank-agnostic) ---------- */
/* ---------- deep-link import (iPhone Shortcut → open Arth with data) ----------
   A Shortcut opens  …/#add=<url-encoded CSV>  and Arth appends it on load.
   Hash fragments are never sent to a server, so the data stays on-device. */
function clearHash(){ try{ history.replaceState(null,"",location.pathname+location.search); }catch(e){} }
function importFromHash(){
  const h=location.hash||""; const m=h.match(/(?:^#|[#&])add=([^&]*)/);
  if(!m) return false;
  if(!state){ clearHash(); return false; }            // not set up yet → ignore
  let txt=""; try{ txt=decodeURIComponent(m[1].replace(/\+/g," ")); }catch(e){ txt=m[1]; }
  clearHash();
  if(!txt.trim()) return false;
  const res=WaterfallParser.parseCSV(txt,{master:state.merchantMaster});
  if(!res || !res.transactions.length){ toast("Shortcut: couldn't read any transactions"); return false; }
  res.transactions.forEach(t=>t.bank="shortcut");
  const r=ingestTransactions(res.transactions, "iPhone Shortcut", "shortcut");
  if(r.added){ activePeriod=r.months[r.months.length-1]; activeTab="spending"; persist();
    toast(`Added ${r.added} transaction${r.added>1?'s':''} from your iPhone${r.dupes?` (${r.dupes} already there)`:''}`); }
  else toast(r.dupes?"Already added — nothing new":"Nothing to import");
  return r.added>0;
}

async function handleCSVImport(fileList){
  const files=[...fileList]; if(!files.length) return;
  parsing=true; render();
  let added=0, dupes=0, failed=[]; const touched=new Set();
  for(const file of files){
    try{
      const text=await file.text();
      const res=WaterfallParser.parseCSV(text,{master:state.merchantMaster});
      if(!res.transactions.length){ failed.push(file.name+(res.error?` (${res.error})`:" (no rows found)")); continue; }
      res.transactions.forEach(t=>t.bank="csv");
      const r=ingestTransactions(res.transactions, file.name, "csv");
      added+=r.added; dupes+=r.dupes; r.months.forEach(m=>touched.add(m));
    }catch(e){ failed.push(file.name+" ("+(e&&e.message||"error")+")"); }
  }
  if(touched.size){ activePeriod=[...touched].sort().pop(); }
  parsing=false; persist(); render();
  toast(added?`Imported ${added} transactions across ${touched.size} month${touched.size>1?'s':''}${dupes?` · ${dupes} dup skipped`:''}`:(dupes?"Already added":"Nothing imported"));
  if(failed.length) setTimeout(()=>alert("Could not import:\n• "+failed.join("\n• ")+"\n\nTip: the file needs a date column and either an amount column or separate debit/credit columns."),300);
}

function addManualTxn(t){

  const bucket=state.spending[period]||{transactions:[],sources:[],total:0};
  bucket.transactions.push({date:t.date, merchant:t.merchant, amount:Math.round((Number(t.amount)||0)*100)/100,
    type:t.type, category:t.category, bank:"manual", manual:true});
  let src=(bucket.sources=bucket.sources||[]).find(s=>s.bank==="manual");
  if(!src){ src={bank:"manual", file:"Manual entries", count:0, spend:0, period}; bucket.sources.push(src); }
  src.count++;
  bucket.total=bucket.transactions.filter(x=>x.type==="debit").reduce((a,x)=>a+x.amount,0);
  src.spend=bucket.transactions.filter(x=>x.type==="debit"&&x.bank==="manual").reduce((a,x)=>a+x.amount,0);
  state.spending[period]=bucket; activePeriod=period; persist();
}

function spendingTrends(){
  const months=Object.keys(state.spending||{}).filter(k=>state.spending[k].transactions&&state.spending[k].transactions.length).sort();

  const recent=months.slice(-6);
  const max=Math.max(1,...recent.map(k=>state.spending[k].total||0));
  const bars=recent.map(k=>{
    const tot=state.spending[k].total||0; const h=Math.round(tot/max*80);
    const lbl=k.slice(5)+"/"+k.slice(2,4);
    return `<div class="trendbar"><div class="tb" style="height:${h}px" title="${inr(tot)}"></div><div class="tl">${lbl}</div></div>`;
  }).join("");
  return `<section class="card"><h2>Spending trend <span class="hint">— total card spend by month</span></h2>

}

const MON=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
function monShort(key){ const m=Number((key||"").slice(5,7)); return MON[m-1]||""; }
function savingsRateNow(){ const m=computeMonth(billFor(activePeriod)); return m.income>0 ? (m.income-m.fixed-m.bill)/m.income : 0; }
function recordedMonths(){ return (state.history||[]).filter(h=>h.savingsRate!=null); }
function avg(a){ return a.length? a.reduce((x,y)=>x+y,0)/a.length : 0; }
const SR_TARGET=0.30;
function sparkline(values){
  if(!values || values.length<2) return "";
  const w=120,h=30, max=Math.max(...values), min=Math.min(...values,0), range=(max-min)||1;
  const pts=values.map((v,i)=>`${(i/(values.length-1)*w).toFixed(1)},${(h-((v-min)/range)*(h-4)-2).toFixed(1)}`).join(" ");
  return `<svg class="spark" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" aria-hidden="true"><polyline points="${pts}" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
}
function barsHTML(points, color, target){
  if(!points.length) return `<p class="note">Lock in a few months to see the trend build here.</p>`;
  const max=Math.max(1,...points.map(p=>p.value), target||0);
  const tline = (target!=null) ? `<div class="targetline" style="bottom:${(Math.max(0,target)/max*80).toFixed(0)}px"><span>${Math.round(target)}%</span></div>` : "";
  return `<div class="trendwrap">${tline}${points.map(p=>{
    const ht=Math.max(2,Math.round((Math.max(0,p.value)/max)*80));
    return `<div class="trendbar"><div class="tb" style="height:${ht}px;background:${color||'var(--accent)'}" title="${esc(p.title||'')}"></div><div class="tl">${esc(p.label)}</div></div>`;
  }).join("")}</div>`;
}
function areaChart(points, color){
  if(!points || points.length<2) return barsHTML(points||[], color);
  const W=300, H=84, pad=6;
  const vals=points.map(p=>p.value), max=Math.max(...vals), min=Math.min(...vals,0), range=(max-min)||1;
  const X=i=> pad + i*(W-2*pad)/(points.length-1);
  const Y=v=> H-pad - ((v-min)/range)*(H-2*pad);
  const line=points.map((p,i)=>`${X(i).toFixed(1)},${Y(p.value).toFixed(1)}`).join(" ");
  const fill=`${pad.toFixed(1)},${(H-pad).toFixed(1)} ${line} ${(W-pad).toFixed(1)},${(H-pad).toFixed(1)}`;
  return `<svg class="areachart" viewBox="0 0 ${W} ${H}" width="100%" height="${H}" preserveAspectRatio="none">
      <polygon class="areafill" points="${fill}" fill="${color}" opacity="0.15"/>
      <polyline class="arealine" points="${line}" fill="none" stroke="${color}" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
      ${points.map((p,i)=>`<circle cx="${X(i).toFixed(1)}" cy="${Y(p.value).toFixed(1)}" r="2.6" fill="${color}"/>`).join("")}
    </svg>
    <div class="arealabels">${points.map(p=>`<span>${esc(p.label)}</span>`).join("")}</div>`;
}

/* ---------- balances: snapshot + 'update as of today' ---------- */
function balanceAgeDays(){ if(!state||!state.lastBalanceUpdate) return Infinity; return (Date.now()-new Date(state.lastBalanceUpdate).getTime())/86400000; }
function balanceAgeLabel(){ const d=balanceAgeDays(); if(d===Infinity) return "not updated yet"; if(d<1) return "updated today"; const n=Math.round(d); return `updated ${n} day${n>1?'s':''} ago`; }
function recordNetWorthSnapshot(){
  state.netWorthSnapshots=state.netWorthSnapshots||[];

/* ---------- lifestyle creep, forecast, nudges (Features 2 & 3) ---------- */
function pctTxt(x){ return (x>=0?"+":"")+Math.round(x*100)+"%"; }
function lifestyleTrend(){
  const h=recordedMonths(); if(h.length<4) return null;
  const half=Math.max(1,Math.floor(h.length/2));
  const firstN=h.slice(0,half), lastN=h.slice(-Math.min(3,half));
  const spA=avg(firstN.map(x=>x.spend||0)), spB=avg(lastN.map(x=>x.spend||0));
  const inA=avg(firstN.map(x=>x.income||0)), inB=avg(lastN.map(x=>x.income||0));
  const spendGrowth=spA>0?(spB-spA)/spA:0, incomeGrowth=inA>0?(inB-inA)/inA:0;
  return { spendGrowth, incomeGrowth, creep:spendGrowth-incomeGrowth };
}
function forecastNext(){
  const h=recordedMonths();
  const income=sum(state.people), fixed=sum(state.fixed), locked=sum(state.locked);
  const recentSpend = h.length? avg(h.slice(-3).map(x=>x.spend||0)) : billFor(currentMonthKey());
  const projLeftover=income-locked-fixed-recentSpend;
  return { projSpend:Math.round(recentSpend), projLeftover:Math.round(projLeftover),
           projSR: income>0?(income-fixed-recentSpend)/income:0 };
}
function categoryMovers(){
  const bm=state.spending||{}, keys=Object.keys(bm).sort();
  if(keys.length<2) return [];
  const catTot=k=>{ const o={}; (bm[k].transactions||[]).forEach(t=>{ if(t.type==="debit") o[t.category]=(o[t.category]||0)+t.amount; }); return o; };
  const cur=catTot(keys[keys.length-1]), prior=keys.slice(0,-1);
  const pAvg={}; prior.forEach(k=>{ const o=catTot(k); Object.keys(o).forEach(c=>pAvg[c]=(pAvg[c]||0)+o[c]/prior.length); });
  return Object.keys(cur).map(c=>({c, now:cur[c], delta: pAvg[c]? (cur[c]-pAvg[c])/pAvg[c] : (cur[c]>0?1:0)}))
    .filter(m=>m.now>=2000 && m.delta>0.25).sort((a,b)=>b.delta-a.delta);
}
function nudges(){
  const out=[], h=recordedMonths();
  let streak=0; for(let i=h.length-1;i>=0;i--){ if(h[i].savingsRate>=SR_TARGET) streak++; else break; }
  if(streak>=3) out.push({tone:"good", text:`🔥 ${streak}-month streak saving 30%+. Keep it going.`});
  const lt=lifestyleTrend();
  if(lt && lt.creep>0.05) out.push({tone:"warn", text:`Lifestyle creep — spending up ${pctTxt(lt.spendGrowth)} vs income ${pctTxt(lt.incomeGrowth)}. Lock the difference before it disappears.`});
  const sp=state.spending[currentMonthKey()];
  if(sp && h.length>=2){ const a=avg(h.slice(-3).map(x=>x.spend||0)); if(a>0 && sp.total>a*1.15) out.push({tone:"warn", text:`This month's spend ${compact(sp.total)} is ${pctTxt(sp.total/a-1)} above your recent average.`}); }
  const mv=categoryMovers()[0]; if(mv) out.push({tone:"warn", text:`${esc(mv.c)} is ${pctTxt(mv.delta)} vs your average — ${compact(mv.now)} this month.`});
  const subs=WaterfallParser.detectSubscriptions(state.spending);
  if(subs.totalMonthly>0) out.push({tone:"info", text:`${compact(subs.totalMonthly)}/mo on subscriptions (${compact(subs.totalYearly)}/yr). Trim what you don't use.`});
  const f=forecastNext();
  out.push({tone:f.projSR>=SR_TARGET?"good":"info", text:`Next month at your recent pace: ~${compact(f.projLeftover)} leftover, ${Math.round(f.projSR*100)}% savings rate.`});
  return out;
}
function nudgesCard(){
  if(!recordedMonths().length && !Object.keys(state.spending||{}).length) return "";  // nothing to insight yet
  const ns=nudges(); if(!ns.length) return "";
  return `<section class="card"><h2>Insights <span class="hint">— spotted in your numbers</span></h2>

}

function viewGoals(){

  const goals = (state.goals||[]).map(g=>{

    const funded = remaining<=0;
    const overdue = months<=0 && !funded;
    const needed = overdue ? 0 : (months>0 ? remaining/months : remaining);
    let cls="long", lbl="long-term";
    if(overdue){ cls="near"; lbl="⚠ date passed"; }

  const totalNeeded = (state.goals||[]).reduce((a,g)=>{

function viewCar(){
  const c=state.car; const price=Number(c.price)||0; const tax=(Number(c.marginalTaxPct)||0)/100;
  const cash={ upfront:price, monthly:0, liquidityHit:price, total:price };
  const down=price*(Number(c.downPct)||0)/100; const principal=price-down;
  const r=(Number(c.loanRatePct)||0)/100/12, n=(Number(c.loanYears)||1)*12;
  const emi = r>0 ? principal*r*Math.pow(1+r,n)/(Math.pow(1+r,n)-1) : principal/n;
  const loanTotal = down + emi*n;
  const loan={ upfront:down, monthly:emi, liquidityHit:down, total:loanTotal };
  const leaseM=Number(c.leaseMonthly)||0, perq=Number(c.perqMonthly)||0;
  const effLeaseMonthly = leaseM*(1-tax) + perq*tax;
  const leaseYears=(Number(c.loanYears)||1); const leaseTotal=effLeaseMonthly*leaseYears*12;
  const lease={ upfront:0, monthly:effLeaseMonthly, liquidityHit:0, total:leaseTotal };
  const rows=[
    {key:"Pay cash", o:cash, note:"You own it outright. But it drains liquidity for other goals."},

    {key:"Company lease", o:lease, note:"Tax-efficient & no upfront cash, but tied to your job. Leaving early can force a costly buyout."}

      <div class="editrow"><span class="k" style="flex:1">Your marginal tax %</span><input type="number" data-car="marginalTaxPct" value="${c.marginalTaxPct}"></div>
      <div class="grouplbl">Loan</div>
      <div class="editrow"><span class="k" style="flex:1">Down payment %</span><input type="number" data-car="downPct" value="${c.downPct}"></div>
      <div class="editrow"><span class="k" style="flex:1">Interest rate % p.a.</span><input type="number" step="0.1" data-car="loanRatePct" value="${c.loanRatePct}"></div>
      <div class="editrow"><span class="k" style="flex:1">Tenure (years)</span><input type="number" data-car="loanYears" value="${c.loanYears}"></div>

/* ============================================================
   REPORTS — cash flow over time + category analysis
   ============================================================ */
function viewReports(){
  const hist=recordedMonths();
  if(!hist.length && !Object.keys(state.spending||{}).length){
    return `<section class="card"><h2>Reports</h2><p class="note">Lock in a month in <a href="#" data-go="plan" style="color:var(--accent)">Plan</a> or add spending — your cash-flow and category trends build here.</p></section>`;
  }
  const recent=hist.slice(-6);
  const sumIn=recent.reduce((a,h)=>a+(h.income||0),0);
  const sumOut=recent.reduce((a,h)=>a+((h.fixed||0)+(h.spend||0)),0);
  const sumSaved=recent.reduce((a,h)=>a+(h.saved||0),0);
  const cfBars=barsHTML(recent.map(h=>({label:monShort(h.key), value:Math.round(h.saved||0), title:inr(h.saved)+" saved · "+h.label})), "var(--accent)");
  const srBars=barsHTML(hist.slice(-8).map(h=>({label:monShort(h.key), value:Math.round(h.savingsRate*100), title:Math.round(h.savingsRate*100)+"% · "+h.label})), "var(--accent)", SR_TARGET*100);
  let streak=0; for(let i=hist.length-1;i>=0;i--){ if(hist[i].savingsRate>=SR_TARGET) streak++; else break; }
  const catAgg={}; Object.values(state.spending||{}).forEach(m=>(m.transactions||[]).forEach(t=>{ if(t.type==="debit") catAgg[t.category]=(catAgg[t.category]||0)+t.amount; }));
  const catRows=Object.entries(catAgg).sort((a,b)=>b[1]-a[1]).slice(0,8);
  const maxCat=Math.max(1,...catRows.map(c=>c[1]));
  const catBars=catRows.map(([c,amt])=>`<div class="catbar"><div class="crow"><span class="cname">${esc(c)}</span><span class="mono">${inr(amt)}</span></div>
    <div class="bar"><span style="width:${(amt/maxCat*100).toFixed(1)}%;background:${catColor(c)}"></span></div></div>`).join("");
  const movers=categoryMovers().slice(0,4);
  const moverRows=movers.length ? movers.map(m=>`<div class="statline"><span class="k">${esc(m.c)}<small>${compact(m.now)} this month</small></span><span class="v mono" style="color:var(--clay)">${pctTxt(m.delta)}</span></div>`).join("") : `<p class="note">Add another month of spending to spot what's rising.</p>`;
  const sp=state.spending[activePeriod];
  const big=sp ? sp.transactions.filter(t=>t.type==="debit").slice().sort((a,b)=>b.amount-a.amount).slice(0,5) : [];
  const bigRows=big.map(t=>`<div class="statline"><span class="k">${esc(t.merchant)}<small>${esc(t.category)} · ${esc((t.date||"").slice(5))}</small></span><span class="v mono">${inr(t.amount)}</span></div>`).join("");
  const monthSel=`<select id="periodSel" class="inlinesel" aria-label="Choose month">${availablePeriods().map(p=>`<option value="${p}"${p===activePeriod?" selected":""}>${periodLabel(p)}</option>`).join("")}</select>`;
  return `
    <section class="card"><h2>Cash flow <span class="hint">— last ${recent.length||0} recorded month${recent.length===1?"":"s"}</span></h2>
      ${recent.length?`<div class="statline"><span class="k">Money in</span><span class="v mono">${inr(sumIn)}</span></div>
      <div class="statline"><span class="k">Money out <small>bills + spending</small></span><span class="v mono">${inr(sumOut)}</span></div>
      <div class="statline"><span class="k">Saved <small>invested + leftover</small></span><span class="v mono" style="color:var(--accent)">${inr(sumSaved)}</span></div>
      <div style="margin-top:12px">${cfBars}</div>`:`<p class="note">Lock in a month in Plan to chart your cash flow.</p>`}
    </section>
    ${hist.length?`<section class="card"><h2>Savings rate trend</h2>${srBars}
      ${streak>=2?`<p class="note" style="margin-top:10px">🔥 <b>${streak}-month streak</b> at or above your 30% target.</p>`:""}</section>`:""}
    ${catBars?`<section class="card"><h2>Where your money goes <span class="hint">— across all months</span></h2>${catBars}</section>`:""}
    ${Object.keys(state.spending||{}).length>=2?`<section class="card"><h2>What's rising <span class="hint">— vs your average</span></h2>${moverRows}</section>`:""}
    <section class="card"><h2>Biggest transactions <span class="hint">— ${monthSel}</span></h2>
      ${bigRows||'<p class="note">No transactions recorded for this month. Pick another month above, or add spending in Spending.</p>'}</section>`;
}

  if(sa) sa.onclick=()=>{ if(confirm("Replace everything with the sample couple's 10-month data?")){ state=migrate(buildSampleState()); activePeriod=currentMonthKey(); persist(); render(); toast("Reset to 10-month sample"); } };
  const cl=root.querySelector('#clearBtn');
  if(cl) cl.onclick=()=>{ if(confirm("Erase all your data from this browser? This cannot be undone.")){ state=null; persist_clear(); startOnboarding(); toast("Cleared"); } };

function persist_clear(){ if(hasStorage){ try{ localStorage.removeItem(STORAGE_KEY); }catch(e){} } else { memState=null; } }

/* ---------- data safety: backup status + reminder ---------- */
function backupAgeDays(){ if(!state || !state.lastBackup) return Infinity; return (Date.now()-new Date(state.lastBackup).getTime())/86400000; }
function backupAgeLabel(){ const d=backupAgeDays(); if(d===Infinity) return "never backed up";
  if(d<1) return "backed up today"; const n=Math.round(d); return `last backup ${n} day${n>1?'s':''} ago`; }
function shouldNudgeBackup(){
  if(backupNudgeDismissed || !hasStorage) return false;
  const used=(state.history||[]).length>=1 || Object.keys(state.spending||{}).length>=1;  // only once they've actually used it
  return used && backupAgeDays()>=14;   // Infinity (never) also qualifies
}
function backupNudge(){
  if(!hasStorage){
    return `<section class="card" style="border-color:var(--clay-soft);background:var(--clay-soft)">
      <div style="display:flex;gap:12px;align-items:flex-start">
        <span style="font-size:18px;line-height:1.2">⚠</span>
        <div style="flex:1"><div style="font-weight:700;color:var(--clay)">This browser isn't saving your data</div>
          <p class="note" style="margin:3px 0 10px;color:var(--clay)">Private/incognito mode blocks local storage — everything will vanish when you close this tab. Download a backup now and reopen it in a normal window.</p>
          <button class="btn primary" id="nudgeBackup">Download backup now</button></div></div></section>`;
  }
  if(!shouldNudgeBackup()) return "";
  return `<section class="card backupnudge">
    <div style="display:flex;gap:13px;align-items:flex-start">
      <div class="pic">${ICON('<path d="M12 3l7 3v5c0 4.6-3 8.2-7 9-4-.8-7-4.4-7-9V6l7-3z"/><path d="m9 12 2 2 4-4"/>')}</div>
      <div style="flex:1"><div style="font-weight:700">Back up your data</div>
        <p class="note" style="margin:2px 0 10px">${state.lastBackup?backupAgeLabel().replace(/^l/,"L"):"You haven't backed up yet"}. Everything lives only in this browser — download a copy so a cleared cache or a new phone can't wipe it.</p>
        <div class="btnrow"><button class="btn primary" id="nudgeBackup">Download backup</button>
          <button class="btn ghost" id="nudgeDismiss">Not now</button></div></div></div></section>`;
}
function exportData(){
  if(state){ state.lastBackup=new Date().toISOString(); persist(); }
  const blob=new Blob([JSON.stringify(state,null,2)],{type:"application/json"});
  const url=URL.createObjectURL(blob); const a=document.createElement("a");
  a.href=url; a.download="arth-backup.json"; a.click(); URL.revokeObjectURL(url);
  backupNudgeDismissed=true; render(); toast("Backup downloaded — keep it safe");
}
function importData(e){
  const file=e.target.files[0]; if(!file) return;
  const r=new FileReader();
  r.onload=()=>{ try{ const data=JSON.parse(r.result);
      if(!data || typeof data!=="object" || !Array.isArray(data.people)) throw new Error("bad");
      state=migrate(data); route="app"; activePeriod=currentMonthKey(); persist(); render(); toast("Backup loaded");
    }catch(err){ alert("That doesn't look like an Arth backup file."); } };
  r.readAsText(file);
}

/* boot */
function boot(){
  applyTheme();
  if(window.matchMedia){ try{ matchMedia("(prefers-color-scheme:dark)").addEventListener("change",()=>{ if(!getThemePref()) render(); }); }catch(e){} }
  importFromHash();                 // iPhone Shortcut deep-link: …/#add=<csv> appends on open
  render();
  // re-import if a deep link arrives while the app is already open (same tab / installed PWA)
  window.addEventListener("hashchange",()=>{ if(importFromHash()) render(); });
  // installable / offline — only over http(s); a no-op on file:// or unsupported browsers
  if("serviceWorker" in navigator && location.protocol.indexOf("http")===0){
    window.addEventListener("load",()=>{ navigator.serviceWorker.register("sw.js").catch(()=>{}); });
  }
}
if(document.readyState==="loading") document.addEventListener("DOMContentLoaded", boot); else boot();
</script>
