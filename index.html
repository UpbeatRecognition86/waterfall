<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Arth — your money, in one calm place</title>
<meta name="description" content="Arth — a net-worth command centre, effortless spending, and a pay-yourself-first plan for Indian households. Private, on-device." />
<link rel="manifest" href="manifest.webmanifest" />
<meta name="theme-color" content="#F4F1EA" media="(prefers-color-scheme: light)" />
<meta name="theme-color" content="#13110D" media="(prefers-color-scheme: dark)" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="Arth" />
<link rel="apple-touch-icon" href="apple-touch-icon.png" />
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png" />
<style>
  /* ============================================================
     WATERFALL — design tokens
     A calm financial instrument panel. Money cascades through
     locked tiers; investments are protected "gold" up top, the
     card bill is the shock absorber below.
     ============================================================ */
  :root{
    /* Arth — warm, premium, calm. Copilot polish × Monarch command-centre. */
    --bg:#F4F1EA; --surface:#FFFFFF; --surface-2:#EEEAE0;
    --ink:#1A1712; --ink-soft:#6B6557; --ink-faint:#A39C8C;
    --line:#E8E2D5;
    --accent:#0E7B57; --accent-soft:#E2F0E8; --accent-ink:#FFFFFF;
    --accent-2:#0A5C5C;                       /* deep teal for gradients */
    --gold:#BD8420; --gold-soft:#F3E8CD;
    --teal:#0E7B57; --teal-soft:#E2F0E8;
    --slate:#5C77A6; --slate-soft:#E5E9F2;
    --spend:#8B76BE; --spend-soft:#ECE6F4;
    --clay:#C24E33; --clay-soft:#F6E2DB;
    --shadow:0 1px 2px rgba(26,23,18,.04),0 10px 30px rgba(26,23,18,.07);
    --shadow-sm:0 1px 2px rgba(26,23,18,.05);
    --radius:20px;
    --mono:'SF Mono','JetBrains Mono',ui-monospace,'Cascadia Code',Menlo,Consolas,monospace;
    --sans:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
  }
  :root[data-theme="dark"]{
    --bg:#13110D; --surface:#1C1A15; --surface-2:#272318;
    --ink:#F3EFE6; --ink-soft:#A8A192; --ink-faint:#726C5E;
    --line:#2C2719;
    --accent:#39C08C; --accent-soft:rgba(57,192,140,.15); --accent-ink:#06130D; --accent-2:#2FA0A0;
    --gold:#D9A646; --gold-soft:rgba(217,166,70,.16);
    --teal:#39C08C; --teal-soft:rgba(57,192,140,.15);
    --slate:#85A0D6; --slate-soft:rgba(133,160,214,.16);
    --spend:#AC97DE; --spend-soft:rgba(172,151,222,.18);
    --clay:#E5704F; --clay-soft:rgba(229,112,79,.16);
    --shadow:0 1px 2px rgba(0,0,0,.5),0 12px 32px rgba(0,0,0,.42);
    --shadow-sm:0 1px 2px rgba(0,0,0,.5);
  }
  @media (prefers-color-scheme:dark){
    :root:not([data-theme="light"]){
      --bg:#13110D; --surface:#1C1A15; --surface-2:#272318;
      --ink:#F3EFE6; --ink-soft:#A8A192; --ink-faint:#726C5E;
      --line:#2C2719;
      --accent:#39C08C; --accent-soft:rgba(57,192,140,.15); --accent-ink:#06130D; --accent-2:#2FA0A0;
      --gold:#D9A646; --gold-soft:rgba(217,166,70,.16);
      --teal:#39C08C; --teal-soft:rgba(57,192,140,.15);
      --slate:#85A0D6; --slate-soft:rgba(133,160,214,.16);
      --spend:#AC97DE; --spend-soft:rgba(172,151,222,.18);
      --clay:#E5704F; --clay-soft:rgba(229,112,79,.16);
      --shadow:0 1px 2px rgba(0,0,0,.5),0 12px 32px rgba(0,0,0,.42);
      --shadow-sm:0 1px 2px rgba(0,0,0,.5);
    }
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{background:var(--bg);color:var(--ink);font-family:var(--sans);line-height:1.5;
    -webkit-font-smoothing:antialiased;font-size:15px;transition:background .2s ease,color .2s ease;}
  .mono{font-family:var(--mono);font-variant-numeric:tabular-nums;}
  .wrap{max-width:760px;margin:0 auto;padding:0 16px 96px;}

  /* ---------- masthead ---------- */
  header.mast{padding:30px 0 14px;display:flex;align-items:center;justify-content:space-between;gap:12px;}
  .themebtn{flex:none;width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:var(--surface);
    color:var(--ink-soft);cursor:pointer;font-size:16px;line-height:1;box-shadow:var(--shadow-sm);transition:.15s;}
  .themebtn:hover{color:var(--ink);border-color:var(--ink-faint);}
  .themebtn:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}
  .themebtn svg{width:18px;height:18px;display:block;margin:0 auto;}
  .themebtn.on{color:var(--accent);border-color:var(--accent);background:var(--accent-soft);}
  .mastbtns{display:flex;gap:8px;flex:none;}
  .brand{display:flex;align-items:center;gap:11px;}
  .brand .glyph{width:38px;height:38px;flex:none;border-radius:12px;
    background:linear-gradient(150deg,var(--accent),var(--accent-2));box-shadow:var(--shadow-sm);
    display:flex;align-items:center;justify-content:center;}
  .brand .glyph svg{width:21px;height:21px;display:block;}
  .brand h1{font-size:22px;letter-spacing:-.025em;margin:0;font-weight:800;}
  .brand .greet{font-size:12.5px;color:var(--ink-faint);font-weight:600;margin-bottom:0;}
  .brand .tag{font-size:12.5px;color:var(--ink-faint);margin-top:1px;}

  /* ---------- tabs ---------- */
  nav.tabs{display:flex;gap:4px;margin:20px 0 22px;background:var(--surface-2);
    padding:4px;border-radius:12px;border:1px solid var(--line);overflow-x:auto;}
  nav.tabs button{flex:1 1 auto;white-space:nowrap;border:0;background:transparent;cursor:pointer;
    font-family:var(--sans);font-size:13.5px;font-weight:600;color:var(--ink-soft);
    padding:9px 12px;border-radius:9px;transition:.15s;}
  nav.tabs button[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow-sm);}
  nav.tabs button:focus-visible{outline:2px solid var(--accent);outline-offset:1px;}

  /* ---------- bottom navigation ---------- */
  .bottomnav{position:fixed;left:0;right:0;bottom:0;z-index:40;display:flex;justify-content:center;
    background:var(--surface);border-top:1px solid var(--line);
    padding:7px 10px calc(7px + env(safe-area-inset-bottom));
    box-shadow:0 -2px 16px rgba(0,0,0,.05);}
  .bottomnav .navinner{display:flex;width:100%;max-width:760px;gap:2px;}
  .bottomnav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;border:0;
    background:transparent;cursor:pointer;color:var(--ink-faint);padding:5px 2px;
    font-family:var(--sans);transition:color .15s;}
  .bottomnav button .navic{display:flex;align-items:center;justify-content:center;width:50px;height:28px;border-radius:14px;transition:background .18s ease;}
  .bottomnav button svg{width:22px;height:22px;}
  .bottomnav button .lbl{font-size:10.5px;font-weight:600;letter-spacing:.005em;}
  .bottomnav button[aria-current="page"]{color:var(--accent);}
  .bottomnav button[aria-current="page"] .navic{background:var(--accent-soft);}
  .bottomnav button:active .navic{transform:scale(.92);}
  .bottomnav button:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:10px;}

  /* ---------- cards ---------- */
  .card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
    padding:22px;margin-bottom:14px;box-shadow:var(--shadow);}
  .card h2{font-size:13px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;
    color:var(--ink-faint);margin:0 0 14px;}
  .card h2 .hint{text-transform:none;letter-spacing:0;font-weight:500;color:var(--ink-faint);}
  .eyebrow{font-size:11.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-faint);}

  /* ---------- verdict ---------- */
  .verdict{background:linear-gradient(180deg,#13302d,#0d2422);color:#EAF1EE;border:0;}
  .verdict h2{color:rgba(234,241,238,.6);}
  .verdict .line{font-size:21px;line-height:1.35;font-weight:600;letter-spacing:-.01em;}
  .verdict .line b{color:#E9C77E;font-weight:700;}
  .verdict .line .ok{color:#9FD8C7;}
  .verdict .line .warn{color:#F0B3A4;}

  /* ---------- inputs ---------- */
  .billbox{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:6px;}
  .billbox label{font-size:13px;color:var(--ink-soft);font-weight:600;}
  input[type="number"],input[type="text"],input[type="date"]{
    font-family:var(--mono);font-size:15px;color:var(--ink);
    border:1px solid var(--line);background:var(--surface-2);border-radius:10px;padding:9px 11px;width:130px;}
  input[type="text"]{font-family:var(--sans);}
  input:focus{outline:2px solid var(--accent);outline-offset:0;border-color:transparent;}
  input[type="range"]{width:100%;accent-color:var(--accent);height:26px;cursor:pointer;}
  .rangewrap{margin:4px 0 2px;}
  .rangeticks{display:flex;justify-content:space-between;font-size:11px;color:var(--ink-faint);}
  select{font-family:var(--sans);font-size:13px;border:1px solid var(--line);
    background:var(--surface-2);border-radius:10px;padding:9px 10px;color:var(--ink);}

  /* ---------- waterfall ---------- */
  .falls{margin-top:6px;}
  .tier{margin-bottom:9px;}
  .tier .toprow{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:4px;}
  .tier .name{font-size:13.5px;font-weight:600;display:flex;align-items:center;gap:6px;}
  .tier .name .lock{font-size:11px;color:var(--gold);font-weight:700;border:1px solid var(--gold-soft);
    background:#fff;border-radius:5px;padding:1px 5px;}
  .tier .amt{font-size:13.5px;font-weight:700;}
  .bar{height:13px;border-radius:7px;background:var(--surface-2);overflow:hidden;}
  .bar > span{display:block;height:100%;border-radius:7px;transition:width .35s cubic-bezier(.2,.7,.2,1);}
  .fill-gold{background:linear-gradient(90deg,var(--gold),#d8a23e);}
  .fill-slate{background:linear-gradient(90deg,var(--slate),#7e9bd0);}
  .fill-spend{background:linear-gradient(90deg,var(--spend),#a493da);}
  .fill-teal{background:linear-gradient(90deg,var(--teal),#3ec08a);}
  .fill-clay{background:linear-gradient(90deg,var(--clay),#e86c58);}
  .tier.sub{margin-left:18px;}
  .tier.sub .name{font-weight:500;color:var(--ink-soft);font-size:12.5px;}
  .deficitbox{margin-top:10px;border:1px solid var(--clay-soft);background:var(--clay-soft);border-radius:10px;padding:12px 14px;}
  .deficitbox .d-title{color:var(--clay);font-weight:700;font-size:13.5px;}
  .deficitbox p{margin:5px 0 0;font-size:13px;color:var(--ink-soft);}

  /* ---------- stat rows ---------- */
  .statline{display:flex;justify-content:space-between;align-items:baseline;padding:9px 0;border-bottom:1px solid var(--line);}
  .statline:last-child{border-bottom:0;}
  .statline .k{font-size:13.5px;color:var(--ink-soft);}
  .statline .k small{display:block;color:var(--ink-faint);font-size:11.5px;}
  .statline .v{font-size:14.5px;font-weight:700;}
  .bignum{font-size:42px;font-weight:800;letter-spacing:-.035em;line-height:1;}
  .bignum.pos{color:var(--teal);} .bignum.neg{color:var(--clay);}
  .subnum{font-size:12.5px;color:var(--ink-faint);margin-top:5px;}

  /* ---------- tiles ---------- */
  .tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:16px;}
  .tile{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;cursor:pointer;
    transition:.15s;text-align:left;color:var(--ink);box-shadow:var(--shadow-sm);}
  .tile:hover{border-color:var(--gold);}
  .tile .tl{font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-faint);}
  .tile .tv{font-size:18px;font-weight:700;margin-top:6px;}
  .tile .ts{font-size:11.5px;color:var(--ink-faint);margin-top:2px;}
  @media (max-width:560px){ .tiles{grid-template-columns:1fr;} }

  /* ---------- goals ---------- */
  .goal{padding:14px 0;border-bottom:1px solid var(--line);}
  .goal:last-child{border-bottom:0;}
  .goal .grow{display:flex;justify-content:space-between;align-items:baseline;gap:10px;}
  .goal .gname{font-weight:600;font-size:14.5px;}
  .goal .gmeta{font-size:12px;color:var(--ink-faint);}
  .goal .gbar{height:9px;border-radius:6px;background:var(--surface-2);margin:8px 0 6px;overflow:hidden;}
  .goal .gbar > span{display:block;height:100%;background:linear-gradient(90deg,var(--teal),#3ec08a);border-radius:6px;}
  .goal .gnote{font-size:12px;color:var(--ink-soft);}
  .pill{display:inline-block;font-size:11px;font-weight:700;padding:2px 8px;border-radius:20px;}
  .pill.near{background:var(--gold-soft);color:var(--gold);}
  .pill.mid{background:var(--slate-soft);color:var(--slate);}
  .pill.long{background:var(--teal-soft);color:var(--teal);}

  /* ---------- car compare ---------- */
  table.cmp{width:100%;border-collapse:collapse;margin-top:8px;}
  table.cmp th,table.cmp td{text-align:right;padding:9px 8px;border-bottom:1px solid var(--line);font-size:13px;}
  table.cmp th:first-child,table.cmp td:first-child{text-align:left;}
  table.cmp thead th{color:var(--ink-faint);font-size:11.5px;text-transform:uppercase;letter-spacing:.04em;}
  table.cmp td.num{font-family:var(--mono);font-variant-numeric:tabular-nums;}
  table.cmp tr.win td{background:var(--accent-soft);}
  table.cmp tr.win td:first-child{font-weight:700;}
  .winbadge{font-size:10.5px;color:var(--teal);font-weight:700;}

  /* ---------- settings editor ---------- */
  .editrow{display:flex;gap:8px;align-items:center;margin-bottom:8px;}
  .editrow input[type="text"]{flex:1;width:auto;min-width:0;}
  .editrow input[type="number"]{width:118px;flex:none;}
  .editrow .del{border:0;background:transparent;color:var(--ink-faint);cursor:pointer;
    font-size:18px;line-height:1;padding:4px 6px;border-radius:6px;}
  .editrow .del:hover{color:var(--clay);background:var(--clay-soft);}
  .addbtn{border:1px dashed var(--line);background:transparent;color:var(--ink-soft);
    border-radius:9px;padding:9px 12px;cursor:pointer;font-family:var(--sans);font-size:13px;font-weight:600;width:100%;}
  .addbtn:hover{border-color:var(--accent);color:var(--accent);}
  .eftoggle{flex:none;border:1px solid var(--line);background:var(--surface-2);color:var(--ink-faint);border-radius:9px;
    padding:7px 9px;font-size:12px;font-weight:700;cursor:pointer;font-family:var(--sans);transition:.15s;}
  .eftoggle.on{border-color:var(--gold);background:var(--gold-soft);color:var(--gold);}
  .grouplbl{font-size:12px;font-weight:700;letter-spacing:.03em;text-transform:uppercase;
    color:var(--ink-faint);margin:18px 0 9px;}
  .grouplbl:first-child{margin-top:0;}

  /* ---------- buttons ---------- */
  .btn{border:0;border-radius:10px;padding:11px 16px;font-family:var(--sans);font-weight:700;
    font-size:14px;cursor:pointer;transition:.15s;}
  .btn.primary{background:var(--accent);color:var(--accent-ink);}
  .btn.primary:hover{filter:brightness(1.06);}
  .btn.primary:disabled{background:var(--surface-2);color:var(--ink-faint);cursor:not-allowed;filter:none;}
  .btn.ghost{background:var(--surface-2);color:var(--ink);border:1px solid var(--line);}
  .btn.ghost:hover{border-color:var(--ink-faint);}
  .btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}
  .btnrow{display:flex;gap:9px;flex-wrap:wrap;margin-top:6px;}

  .note{font-size:12px;color:var(--ink-faint);line-height:1.5;}
  .privacy{display:flex;gap:9px;align-items:flex-start;background:var(--teal-soft);
    border-radius:10px;padding:11px 13px;margin-bottom:16px;}
  .privacy .dot{width:8px;height:8px;border-radius:50%;background:var(--teal);margin-top:6px;flex:none;}
  .privacy p{margin:0;font-size:12.5px;color:var(--teal);}
  footer{margin-top:26px;text-align:center;}
  footer .disc{font-size:11.5px;color:var(--ink-faint);max-width:520px;margin:0 auto;line-height:1.5;}

  /* ---------- onboarding wizard ---------- */
  .wizwrap{max-width:560px;margin:0 auto;padding:0 16px 60px;}
  .wizhead{padding:40px 0 10px;text-align:center;}
  .wizhead .glyph{width:52px;height:52px;border-radius:15px;margin:0 auto 16px;
    background:linear-gradient(150deg,var(--accent),var(--accent-2));box-shadow:var(--shadow);
    display:flex;align-items:center;justify-content:center;}
  .wizhead .glyph svg{width:28px;height:28px;display:block;}
  .progress{height:6px;background:var(--surface-2);border-radius:6px;overflow:hidden;margin:18px 0 22px;border:1px solid var(--line);}
  .progress > span{display:block;height:100%;background:var(--accent);transition:width .3s;}
  .stepcount{font-size:12px;color:var(--ink-faint);text-align:center;margin-bottom:6px;}
  .step h2{font-size:23px;font-weight:700;letter-spacing:-.01em;margin:0 0 6px;text-transform:none;color:var(--ink);}
  .step p.lead{font-size:14.5px;color:var(--ink-soft);margin:0 0 20px;}
  .stepnav{display:flex;justify-content:space-between;gap:10px;margin-top:26px;}
  .numpick{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:8px;}
  .numpick button{width:54px;height:54px;border-radius:12px;border:1px solid var(--line);background:var(--surface);
    font-size:20px;font-weight:700;cursor:pointer;color:var(--ink);}
  .numpick button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);color:var(--accent);}
  .heroprivacy{font-size:12.5px;color:var(--ink-faint);margin-top:18px;text-align:center;}
  .stepcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:24px 22px;box-shadow:var(--shadow);}
  .chips{display:flex;flex-wrap:wrap;gap:7px;margin:0 0 14px;}
  .chip{border:1px solid var(--line);background:var(--surface-2);color:var(--ink-soft);border-radius:20px;
    padding:6px 12px;font-size:12.5px;font-weight:600;cursor:pointer;font-family:var(--sans);transition:.15s;}
  .chip:hover{border-color:var(--accent);color:var(--accent);}
  .chip:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}
  .chiplbl{font-size:12px;color:var(--ink-faint);margin:0 0 7px;font-weight:600;}
  .usagepick{display:flex;flex-direction:column;gap:10px;margin:6px 0 16px;}
  .usageopt{display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;width:100%;
    border:1px solid var(--line);background:var(--surface-2);border-radius:14px;padding:14px 16px;cursor:pointer;
    font-family:var(--sans);color:var(--ink);transition:.15s;}
  .usageopt:hover{border-color:var(--accent);}
  .usageopt.on{border-color:var(--accent);background:var(--accent-soft);box-shadow:inset 0 0 0 1px var(--accent);}
  .usageopt .ut{font-size:14.5px;font-weight:700;}
  .usageopt .us{font-size:12.5px;color:var(--ink-soft);}
  .usageopt.on .us{color:var(--accent);}
  .usageopt:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}
  .landwordmark{font-size:14px;font-weight:800;letter-spacing:.2em;text-transform:uppercase;color:var(--accent);margin-bottom:6px;}
  .pillars{display:flex;flex-direction:column;gap:10px;margin:22px 0 24px;}
  .pillar{display:flex;gap:13px;align-items:flex-start;background:var(--surface);border:1px solid var(--line);
    border-radius:14px;padding:14px 15px;box-shadow:var(--shadow-sm);}
  .pillar .pic{width:38px;height:38px;flex:none;border-radius:10px;background:var(--accent-soft);color:var(--accent);
    display:flex;align-items:center;justify-content:center;}
  .pillar .pic svg{width:20px;height:20px;}
  .pillar b{display:block;font-size:14px;font-weight:700;color:var(--ink);}
  .pillar span{display:block;font-size:12.5px;color:var(--ink-soft);margin-top:2px;line-height:1.45;}

  /* ---------- checklist ritual ---------- */
  .checkrow{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);}
  .checkrow:last-child{border-bottom:0;}
  .checkrow .cbox{width:24px;height:24px;flex:none;border-radius:7px;border:2px solid var(--line);
    background:var(--surface-2);cursor:pointer;display:flex;align-items:center;justify-content:center;
    font-size:15px;color:#fff;transition:.15s;padding:0;font-family:var(--sans);}
  .checkrow .cbox:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}
  .checkrow .cbox.on{background:var(--teal);border-color:var(--teal);}
  .checkrow .cmain{flex:1;min-width:0;}
  .checkrow .ctitle{font-size:14px;font-weight:600;}
  .checkrow .csub{font-size:12px;color:var(--ink-faint);}

<div id="app"></div>
<div id="toast" role="status" aria-live="polite"></div>

<script src="parser.js"></script>
<script>
"use strict";
/* ============================================================
   STORAGE — localStorage with safe in-memory fallback
   ============================================================ */
const STORAGE_KEY = "waterfall.finance.v1";
const hasStorage = (() => {
  try { const k="__wf_t"; localStorage.setItem(k,"1"); localStorage.removeItem(k); return true; }
  catch(e){ return false; }
})();
let memState = null;
function loadState(){
  let raw=null;
  if(hasStorage){ try{ const r=localStorage.getItem(STORAGE_KEY); raw=r?JSON.parse(r):null; }catch(e){ raw=null; } }
  else raw=memState;
  return raw ? migrate(raw) : null;
}
function persist(){
  if(hasStorage){ try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }catch(e){} }
  else { memState = state; }
}

/* ============================================================
   SAMPLE DATA — illustrative dual-income couple. "Explore" loads this.
   ============================================================ */
function isoIn(months){ const d=new Date(); d.setMonth(d.getMonth()+months); return d.toISOString().slice(0,10); }
const SAMPLE = {
  people:[ {name:"You (take-home)", amount:240000}, {name:"Partner (take-home)", amount:225000} ],
  fixed:[
    {name:"Rent", amount:41000},{name:"Electricity", amount:2500},{name:"Household help", amount:7000},
    {name:"Insurance (term + health)", amount:10000},{name:"Subscriptions", amount:5000}
  ],
  locked:[
    {name:"Retirement SIP", amount:50000, kind:"equity"},
    {name:"Goal fund (car → property)", amount:90000, kind:"safe"}
  ],
  surplus:{ goalsPct:55, flexPct:45 },
  flexBuffer: 0,
  assets:[
    {name:"Emergency fund", amount:1000000, cls:"cash"},
    {name:"Stocks & mutual funds", amount:900000, cls:"equity", invested:760000},
    {name:"Fixed deposits", amount:1300000, cls:"cash"},
    {name:"Digital gold", amount:850000, cls:"gold", invested:720000}
  ],
  liabilities:[],
  goals:[
    {name:"Car", target:2700000, saved:0, date:isoIn(10), bucket:"safe"},
    {name:"First child fund", target:1500000, saved:0, date:isoIn(30), bucket:"safe"},
    {name:"Property down payment", target:4000000, saved:0, date:isoIn(20), bucket:"safe"},
    {name:"Retirement (long-term)", target:50000000, saved:900000, date:isoIn(330), bucket:"equity"}
  ],
  car:{ price:2700000, marginalTaxPct:30, leaseMonthly:48000, perqMonthly:3200, loanRatePct:8.0, loanYears:5, downPct:20 },
  thisMonthBill: 180000,
  history:[]
};

/* a fresh, empty plan the wizard fills in */
function blankPlan(){
  return { people:[{name:"You",amount:0}], fixed:[], locked:[], surplus:{goalsPct:50,flexPct:50},
    flexBuffer:0, assets:[], liabilities:[], goals:[], bills:{}, history:[] };
}

/* ============================================================
   DEMO DATA — a fully "lived-in" couple: 10 recorded months of
   spending (with recurring subs), a fluctuating savings rate incl.
   one overspend month that draws the buffer, goal progress, and a
   climbing net worth. Seeded RNG → identical every load.
   ============================================================ */
function buildSampleState(){
  const s = structuredClone(SAMPLE);
  const income = sum(s.people), fixed = sum(s.fixed), locked = sum(s.locked);
  const ceiling = income - locked - fixed;
  s.cardUsage = "heavy"; s.spending = {}; s.history = []; s.flexBuffer = 0;
  s.goals.forEach(g => { g.saved = /retirement/i.test(g.name) ? 600000 : 0; });

  const now = new Date(), mkey = off => { const d = new Date(now.getFullYear(), now.getMonth()-off, 1); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0"); };
  const prior = []; for (let i=10;i>=1;i--) prior.push(mkey(i)); const cur = mkey(0);

  let seed = 20260616; const rnd = () => { seed = (seed*1103515245 + 12345) & 0x7fffffff; return seed/0x7fffffff; };
  const ri = (a,b) => Math.floor(a + rnd()*(b-a+1));
  const subs = [["Netflix",649,"Bills & Subscriptions"],["Spotify",119,"Bills & Subscriptions"],["Amazon Prime",299,"Bills & Subscriptions"],["Jio Fiber",1499,"Bills & Subscriptions"],["Cult.fit",2000,"Health"]];
  const pool = [["Swiggy","Food & Dining",250,1100],["Zomato","Food & Dining",300,1400],["BigBasket","Groceries",1200,4200],["Blinkit","Groceries",180,1100],["Amazon","Shopping",400,5500],["Myntra","Shopping",700,4500],["Uber","Travel & Transport",120,650],["Indian Oil","Travel & Transport",1800,3600],["PVR Cinemas","Entertainment",350,1300],["Apollo Pharmacy","Health",250,1400]];
  function buildMonth(mk, target){
    const txns = []; let total = 0;
    subs.forEach(([m,a,c]) => { txns.push({date:mk+"-0"+(2+(a%6)), merchant:m, amount:a, type:"debit", category:c, bank:"demo"}); total += a; });
    let g = 0;
    while (total < target-1200 && g++ < 400){ const [m,c,lo,hi] = pool[ri(0,pool.length-1)]; const amt = ri(lo,hi); if (total+amt > target+1500) continue; txns.push({date:mk+"-"+String(ri(1,28)).padStart(2,"0"), merchant:m, amount:amt, type:"debit", category:c, bank:"demo"}); total += amt; }
    txns.push({date:mk+"-01", merchant:"Salary Credit", amount:income, type:"credit", category:"Payment / Transfer", bank:"demo"});
    txns.sort((a,b) => a.date<b.date?-1:1);
    return { transactions:txns, sources:[{bank:"demo", file:"Statement-"+mk+".pdf", count:txns.length, spend:Math.round(total), period:mk}], total:Math.round(total) };
  }
  const spends = [176000,168000,205000,182000,159000,225000,171000,279000,164000,188000]; // idx 7 overspends the ceiling → buffer drawdown
  prior.forEach((mk, idx) => {
    const bucket = buildMonth(mk, spends[idx]); s.spending[mk] = bucket;
    const bill = bucket.total, surplus = ceiling - bill, deficit = surplus<0?-surplus:0, saved = income - fixed - bill;
    if (surplus >= 0){
      const toGoals = Math.round(surplus*0.6);
      const targets = s.goals.filter(gl => !/retirement/i.test(gl.name));
      let rem = toGoals; targets.forEach((gl,j) => { const give = j===targets.length-1 ? rem : Math.round(toGoals/targets.length); gl.saved = (Number(gl.saved)||0) + give; rem -= give; });
      s.flexBuffer += surplus - toGoals;
    } else { s.flexBuffer = Math.max(0, s.flexBuffer - deficit); }
    s.history.push({ key:mk, label:periodLabel(mk), bill, surplus:Math.max(0,surplus), deficit, income, fixed, locked, spend:bill, saved:Math.round(saved), savingsRate: income>0?saved/income:0, buffer:Math.round(s.flexBuffer), applied:[] });
  });
  // net-worth series that climbs by each month's saving and ends at the live net worth
  const finalNW = sum(s.assets) + s.goals.reduce((a,g)=>a+(Number(g.saved)||0),0) + s.flexBuffer - sum(s.liabilities);
  const totalSaved = s.history.reduce((a,h)=>a+h.saved, 0);
  let run = finalNW - totalSaved;
  s.history.forEach(h => { run += h.saved; h.netWorth = Math.round(run); });
  // current month left "in progress" (shows the live ritual + a ready Spending tab)
  s.spending[cur] = buildMonth(cur, 184000); s.bills = {}; s.bills[cur] = s.spending[cur].total;
  return s;
}

/* ============================================================
   SCHEMA MIGRATION — keep older saved/imported state working,
   idempotent, run on every load + before render.
   ============================================================ */
const SCHEMA_VERSION = 2;
function migrate(s){
  if(!s || typeof s!=="object") return s;
  s.people = (Array.isArray(s.people)&&s.people.length) ? s.people : [{name:"You",amount:0}];
  ["fixed","locked","assets","liabilities","goals","history"].forEach(k=>{ if(!Array.isArray(s[k])) s[k]=[]; });
  s.spending = (s.spending && typeof s.spending==="object") ? s.spending : {};
  s.merchantMaster = (s.merchantMaster && typeof s.merchantMaster==="object") ? s.merchantMaster : {};
  s.subPrefs = (s.subPrefs && typeof s.subPrefs==="object") ? s.subPrefs : {};
  s.netWorthSnapshots = Array.isArray(s.netWorthSnapshots) ? s.netWorthSnapshots : [];   // [{date,netWorth}] from balance updates
  if(typeof s.lastBalanceUpdate!=="string") s.lastBalanceUpdate = s.lastBalanceUpdate || null;
  s.surplus = s.surplus || {goalsPct:50, flexPct:50};
  if(typeof s.flexBuffer!=="number") s.flexBuffer = 0;
  // v2: per-period card bills (replaces the single thisMonthBill)
  s.bills = (s.bills && typeof s.bills==="object") ? s.bills : {};
  if(typeof s.thisMonthBill==="number" && s.bills[currentMonthKey()]==null){
    s.bills[currentMonthKey()] = s.thisMonthBill;
  }
  delete s.thisMonthBill; delete s.car;
  s.version = SCHEMA_VERSION;
  return s;
}

/* ============================================================
   STATE & ROUTING
   ============================================================ */
let state = loadState();           // null => first run => onboarding
let route = state ? "app" : "onboarding";
let activeTab = "home";
let _lastTab = null;
let activePeriod = currentMonthKey();   // the month the user is working on (supports backfill)

/* onboarding draft */
let onb = null;
let _onbDir = 1;   // direction of last onboarding nav (1 next, -1 back) for slide transitions
/* ephemeral monthly ritual state */
let ritual = { salary:false, locked:false, bills:false };
/* ephemeral allocation rows for this month */
let alloc = null;
/* ephemeral transaction category filter (Spending tab) */
let txnFilter = "All";
let txnSearch = "";        // live merchant search
let _focusSearch = false;  // restore focus to the search box after a keystroke re-render
/* ephemeral: show the manual "add a transaction" form */
let showManual = false;
/* ephemeral: dismiss the back-up reminder for this session */
let backupNudgeDismissed = false;
/* ephemeral: show the "update balances as of today" editor */
let balanceMode = false;
let balanceNudgeDismissed = false;

/* ============================================================
   THEME — light / dark / follow-system, with manual toggle
   ============================================================ */
const THEME_KEY = "waterfall.theme";
function getThemePref(){ try{ return localStorage.getItem(THEME_KEY)||""; }catch(e){ return ""; } }
function setThemePref(t){ try{ if(t) localStorage.setItem(THEME_KEY,t); else localStorage.removeItem(THEME_KEY); }catch(e){} }
function applyTheme(){
  const t=getThemePref(), r=document.documentElement;
  if(t==="light"||t==="dark") r.setAttribute("data-theme",t); else r.removeAttribute("data-theme");
}
function resolvedTheme(){
  const t=getThemePref(); if(t) return t;
  return (window.matchMedia && matchMedia("(prefers-color-scheme:dark)").matches) ? "dark":"light";
}
function toggleTheme(){ setThemePref(resolvedTheme()==="dark"?"light":"dark"); applyTheme(); render(); }
function themeBtnHTML(){ return `<button class="themebtn" id="themeBtn" title="Switch light / dark" aria-label="Switch theme">${resolvedTheme()==="dark"?"☀":"☾"}</button>`; }
function settingsBtnHTML(){ return `<button class="themebtn${activeTab==='settings'?' on':''}" id="settingsBtn" title="Settings" aria-label="Settings" aria-pressed="${activeTab==='settings'}">${ICON('<path d="M4 7h9"/><path d="M17 7h3"/><circle cx="15" cy="7" r="2"/><path d="M4 17h3"/><path d="M11 17h9"/><circle cx="9" cy="17" r="2"/>')}</button>`; }

/* ============================================================
   HELPERS
   ============================================================ */
const sum = arr => (arr||[]).reduce((a,b)=>a+(Number(b.amount)||0),0);
function inr(n){ return "₹"+Math.round(Number(n)||0).toLocaleString("en-IN"); }
function compact(n){
  n=Number(n)||0; const a=Math.abs(n);
  if(a>=1e7) return "₹"+(n/1e7).toFixed(2).replace(/\.00$/,"")+"Cr";
  if(a>=1e5) return "₹"+(n/1e5).toFixed(2).replace(/\.00$/,"")+"L";
  if(a>=1e3) return "₹"+(n/1e3).toFixed(0)+"k";
  return "₹"+Math.round(n);
}
function monthsBetween(iso){
  const t=new Date(iso), now=new Date();
  return Math.max(0, (t.getFullYear()-now.getFullYear())*12 + (t.getMonth()-now.getMonth()));
}
function esc(s){ return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function toast(msg){
  const t=document.getElementById("toast"); t.textContent=msg; t.classList.add("show");
  clearTimeout(toast._t); toast._t=setTimeout(()=>t.classList.remove("show"),2200);
}
function currentMonthKey(){ const d=new Date(); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0"); }
function currentMonthLabel(){ return new Date().toLocaleDateString("en-IN",{month:"long",year:"numeric"}); }
function greeting(){ const h=new Date().getHours(); return h<12?"Good morning":h<17?"Good afternoon":"Good evening"; }
/* Arth brand mark — three ascending bars (growth) in white, dropped inside a .glyph tile */
function brandMarkSVG(){ return `<svg viewBox="0 0 24 24" fill="#fff" aria-hidden="true"><rect x="3.5" y="13" width="4" height="7.5" rx="1.4" opacity=".62"/><rect x="10" y="9" width="4" height="11.5" rx="1.4" opacity=".82"/><rect x="16.5" y="4.5" width="4" height="16" rx="1.4"/></svg>`; }
/* ---------- period (month) helpers — A1 ---------- */
function periodLabel(key){ const p=String(key||"").split("-"); const d=new Date(Number(p[0]), Number(p[1])-1, 1);
  return isNaN(d.getTime()) ? String(key) : d.toLocaleDateString("en-IN",{month:"long",year:"numeric"}); }
function billFor(period){
  const b=(state.bills||{})[period];
  if(b!=null) return Number(b)||0;
  const sp=(state.spending||{})[period];
  return sp ? Math.round(sp.total||0) : 0;
}
function setBill(period, v){ state.bills=state.bills||{}; state.bills[period]=Math.max(0, Number(v)||0); }
function statementPeriod(txns){
  const counts={};
  (txns||[]).forEach(t=>{ const p=String(t.date||"").slice(0,7); if(/^\d{4}-\d{2}$/.test(p)) counts[p]=(counts[p]||0)+1; });
  const keys=Object.keys(counts);
  return keys.length ? keys.sort((a,b)=>counts[b]-counts[a])[0] : null;
}
function availablePeriods(){
  const set=new Set([currentMonthKey()]);
  Object.keys(state.spending||{}).forEach(k=>set.add(k));
  (state.history||[]).forEach(h=>set.add(h.key));
  return [...set].sort().reverse();   // newest first
}
function periodSwitcher(){
  const opts=availablePeriods();
  return `<div class="periodbar"><span class="eyebrow">Month</span>
    <select id="periodSel" aria-label="Choose month">
      ${opts.map(p=>`<option value="${p}"${p===activePeriod?" selected":""}>${periodLabel(p)}${p===currentMonthKey()?" · this month":""}</option>`).join("")}
    </select></div>`;
}
function emergencyFund(){ return (state.assets.find(x=>x.ef===true) || state.assets.find(x=>/emergenc/i.test(x.name)) || {}); }
/* total money saved in goal pots + the flex buffer (tracked on top of assets) */
function savedPots(){ return (state.goals||[]).reduce((a,g)=>a+(Number(g.saved)||0),0) + (Number(state.flexBuffer)||0); }
/* net worth now = assets + saved pots (goals + buffer) − liabilities */
function netWorthNow(){ return sum(state.assets) + savedPots() - sum(state.liabilities); }

/* core monthly engine */
function computeMonth(bill){
  const income = sum(state.people);
  const locked = sum(state.locked);
  const fixed  = sum(state.fixed);
  const ceiling = income - locked - fixed;
  const b = Number(bill)||0;
  const surplus = ceiling - b;
  return { income, locked, fixed, ceiling, bill:b, surplus, deficit: surplus<0 ? -surplus : 0 };
}

/* smart suggested allocation destination for leftover money */
function suggestDestination(){
  // 1. nearest-term goal that isn't fully funded
  const near = (state.goals||[])
    .map((g,i)=>({i,g,m:monthsBetween(g.date)}))
    .filter(o=>o.m<=36 && (Number(o.g.saved)||0) < (Number(o.g.target)||0))
    .sort((a,b)=>a.m-b.m)[0];
  if(near) return {dest:"goal:"+near.i, label:near.g.name+" (near-term, behind)"};
  // 2. emergency fund under ~6 months of fixed costs
  const ef = emergencyFund(); const fixedM = sum(state.fixed);
  if(ef.amount!=null && fixedM>0 && (ef.amount/fixedM) < 6) return {dest:"ef", label:"Emergency fund (under 6 months)"};
  // 3. otherwise the flex buffer
  return {dest:"buffer", label:"Flex buffer"};
}

/* ---------- funding-plan engine (Level 2) ----------
   Given income, fixed bills, a monthly spending estimate, and goals,
   work out the spare capacity to invest and a feasible split across goals
   (nearest-term first), flagging goals that won't make their date. */
function fundingPlan(income, fixedMonthly, spendEstimate, goals){
  const capacity = Math.max(0, (Number(income)||0) - (Number(fixedMonthly)||0) - (Number(spendEstimate)||0));
  const items=(goals||[]).map((g,i)=>{
    const months=monthsBetween(g.date);
    const remaining=Math.max(0,(Number(g.target)||0)-(Number(g.saved)||0));
    const overdue = months<=0 && remaining>0;
    return { i, name:g.name||("Goal "+(i+1)), bucket:g.bucket||"safe", months, remaining, overdue,
             req: overdue ? 0 : (months>0 ? remaining/months : remaining) };
  });
  const totalReq=items.reduce((a,x)=>a+x.req,0);
  let alloc={};
  if(totalReq<=capacity){ items.forEach(x=>alloc[x.i]=x.req); }
  else { // over capacity → fund nearest-term first, capped at each goal's need
    let left=capacity;
    [...items].sort((a,b)=>a.months-b.months).forEach(x=>{ const give=Math.min(x.req,left); alloc[x.i]=give; left-=give; });
  }
  const rows=items.map(x=>{
    const s=alloc[x.i]||0, short=s < x.req-1;
    let note, status;
    if(x.overdue){ status="short"; note="this goal's date has passed — set a new target date"; }
    else if(!short){ status="ok"; note = x.req>0 ? "on track for its date" : "already funded"; }
    else if(s>0){ status="short"; const mo=Math.ceil(x.remaining/s); note=`at ₹${Math.round(s).toLocaleString("en-IN")}/mo it lands in ~${mo} mo (you wanted ${x.months}) — trim the target or push the date`; }
    else { status="short"; note="nothing left this round — reprioritise, or free up capacity"; }
    return { i:x.i, name:x.name, bucket:x.bucket, months:x.months, req:Math.round(x.req), suggested:Math.round(s), status, note };
  });
  const usedForGoals=rows.reduce((a,r)=>a+r.suggested,0);
  return { capacity:Math.round(capacity), totalRequired:Math.round(totalReq), rows,
           spare:Math.max(0, Math.round(capacity-usedForGoals)), feasible: totalReq<=capacity };
}
function seedLockedFromPlan(plan){
  const locked=plan.rows.filter(r=>r.suggested>0).map(r=>({name:r.name, amount:r.suggested, kind:r.bucket==="equity"?"equity":"safe"}));
  if(plan.spare>0) locked.push({name:"Retirement / long-term SIP", amount:plan.spare, kind:"equity"});
  onb.draft.locked=locked;
}

   AI INSIGHTS (optional, bring-your-own-key)
   Calls the Anthropic Messages API directly from the browser using a
   key the user stores locally. The key is kept OUT of `state` so it is
   never included in exports. For production this call moves behind a
   small backend; the UI is unchanged.

const AI_KEY_STORAGE = "waterfall.aikey";
function getAiKey(){ try{ return localStorage.getItem(AI_KEY_STORAGE)||""; }catch(e){ return ""; } }
function setAiKey(k){ try{ if(k) localStorage.setItem(AI_KEY_STORAGE,k); else localStorage.removeItem(AI_KEY_STORAGE); }catch(e){} }
let aiState = { loading:false, result:null, error:null };

const AI_SYSTEM = `You are a careful, realistic personal-finance planner for Indian households. All amounts are in INR.
You are given monthly take-home pay, fixed monthly bills, typical monthly card/everyday spending, current assets, an emergency fund, and goals (target amount, amount already saved, months to the target date, preferred instrument).
Produce a realistic monthly plan for how much to lock away (invest) toward each goal, plus long-term/retirement.

Principles you MUST apply:
- Spare capacity to invest is roughly take-home minus fixed bills minus typical spending. Never suggest locking away more than is realistically affordable.
- Build or keep an emergency fund of about 6 months of expenses before aggressive goal saving.
- No single goal should demand an unrealistic share of take-home. If a goal's target and date imply an implausible monthly amount (for example a large car in a few months), DO NOT simply output that number — set its suggested_monthly to a realistic figure and add a flag proposing concrete fixes: a lower target, a later date, or financing, with specific INR numbers.
- Prioritise by urgency and importance. Keep near-term goals (under 3 years) in safe instruments; do not starve long-term/retirement.
- Be specific and honest. If goals collectively exceed capacity, allocate sensibly and state plainly what has to give.
Return only the structured plan.`;

const AI_SCHEMA = { type:"object", additionalProperties:false,
  required:["headline","monthly_plan","flags","summary"],
  properties:{
    headline:{type:"string"},
    monthly_plan:{type:"array", items:{type:"object", additionalProperties:false,
      required:["name","suggested_monthly","instrument","rationale"],
      properties:{ name:{type:"string"}, suggested_monthly:{type:"number"},
        instrument:{type:"string", enum:["safe","equity"]}, rationale:{type:"string"} }}},
    flags:{type:"array", items:{type:"object", additionalProperties:false,
      required:["goal","issue","suggestion"],
      properties:{ goal:{type:"string"}, issue:{type:"string"}, suggestion:{type:"string"} }}},
    summary:{type:"string"} } };

function financialsFrom(src){
  const ef=(src.assets||[]).find(x=>/emergenc/i.test(x.name));
  return {
    currency:"INR",
    monthly_take_home: sum(src.people),
    fixed_bills_monthly: sum(src.fixed),
    typical_card_spend_monthly: Number(src.thisMonthBill) || ((src.bills && src.bills[currentMonthKey()]) || 0),
    emergency_fund: ef?(Number(ef.amount)||0):0,
    assets:(src.assets||[]).map(a=>({name:a.name, amount:Number(a.amount)||0, class:a.cls})),
    liabilities:(src.liabilities||[]).map(l=>({name:l.name, outstanding:Number(l.amount)||0})),
    goals:(src.goals||[]).map(g=>({name:g.name, target:Number(g.target)||0, saved:Number(g.saved)||0,
      months_to_target:monthsBetween(g.date), prefers:g.bucket||"safe"}))
  };
}

async function runAiPlan(src){
  const key=getAiKey();
  if(!key){ aiState={loading:false,result:null,error:"no-key"}; render(); return; }
  aiState={loading:true,result:null,error:null}; render();
  try{
    const res=await fetch("https://api.anthropic.com/v1/messages",{
      method:"POST",
      headers:{ "content-type":"application/json", "x-api-key":key,
        "anthropic-version":"2023-06-01", "anthropic-dangerous-direct-browser-access":"true" },
      body:JSON.stringify({
        model:"claude-opus-4-8", max_tokens:2500, thinking:{type:"adaptive"},
        system:AI_SYSTEM,
        messages:[{role:"user", content:"Here are the household's finances. Produce the plan:\n"+JSON.stringify(financialsFrom(src),null,2)}],
        output_config:{ format:{ type:"json_schema", schema:AI_SCHEMA } }
      })
    });
    if(!res.ok){ const t=await res.text(); throw new Error("API "+res.status+" — "+t.slice(0,200)); }
    const data=await res.json();
    const textBlock=(data.content||[]).filter(b=>b.type==="text").pop();
    if(!textBlock) throw new Error("No plan returned");
    aiState={loading:false, result:JSON.parse(textBlock.text), error:null};
  }catch(e){ aiState={loading:false, result:null, error:String((e&&e.message)||e)}; }
  render();
}
function applyAiPlan(){
  const r=aiState.result; if(!r) return;
  const locked=r.monthly_plan.filter(p=>(Number(p.suggested_monthly)||0)>0)
    .map(p=>({name:p.name, amount:Math.round(p.suggested_monthly), kind:p.instrument==="equity"?"equity":"safe"}));
  if(route==="onboarding"){ onb.draft.locked=locked; }
  else { state.locked=locked; persist(); }
  aiState={loading:false,result:null,error:null};
  render(); toast("AI plan applied to your locked investments");
}
function aiPlanHTML(){
  if(aiState.loading) return `<div class="suggestbox" style="background:var(--spend-soft);color:var(--spend)">✨ Thinking through a realistic plan… (a few seconds)</div>`;

  if(aiState.error) return `<div class="suggestbox" style="background:var(--clay-soft);color:var(--clay)">AI error: ${esc(aiState.error)}</div>`;

  const r=aiState.result;

/* ---------- GSAP motion (feature-detected; app works without it) ---------- */
function fmtCount(n, kind, suffix){
  if(kind==="inr") return inr(n);
  if(kind==="compact") return compact(n);
  if(kind==="pct") return Math.round(n)+"%";
  return Math.round(n)+(suffix||"");
}
function animateView(){
  const g=window.gsap, v=document.getElementById("view"); if(!g||!v) return;
  const blocks=v.querySelectorAll(".periodbar, .lockedbanner, .card, .tile");
  g.fromTo(blocks, {opacity:0, y:18}, {opacity:1, y:0, duration:.5, stagger:.05, ease:"power3.out", clearProps:"transform,opacity"});
  // count-up the headline numbers
  v.querySelectorAll("[data-count]").forEach(el=>{
    const to=parseFloat(el.getAttribute("data-count"))||0;
    const kind=el.getAttribute("data-countkind")||"", suffix=el.getAttribute("data-suffix")||"";
    const o={n:0}; g.to(o, {n:to, duration:.9, ease:"power2.out", onUpdate:()=>{ el.textContent=fmtCount(o.n, kind, suffix); }});
  });
  // bars grow from zero
  g.fromTo(v.querySelectorAll(".bar > span, .gbar > span"), {scaleX:0}, {scaleX:1, transformOrigin:"left center", duration:.7, stagger:.04, ease:"power2.out", clearProps:"transform"});
  // donut eases in
  const donut=v.querySelector(".donutwrap svg"); if(donut) g.fromTo(donut, {scale:.7, opacity:0, transformOrigin:"70px 70px"}, {scale:1, opacity:1, duration:.6, ease:"back.out(1.6)"});
  // savings-rate ring draws itself in
  v.querySelectorAll(".srarc").forEach(arc=>{ const c=parseFloat(arc.getAttribute("data-c"))||0;
    g.fromTo(arc, {strokeDashoffset:c}, {strokeDashoffset:parseFloat(arc.getAttribute("stroke-dashoffset"))||0, duration:1, ease:"power2.out"}); });
  // net-worth area line draws itself in
  v.querySelectorAll(".arealine").forEach(p=>{ const len=p.getTotalLength?p.getTotalLength():0;
    if(len) g.fromTo(p, {strokeDasharray:len, strokeDashoffset:len}, {strokeDashoffset:0, duration:1.1, ease:"power2.out"}); });
  v.querySelectorAll(".areafill").forEach(f=>g.from(f, {opacity:0, duration:1, ease:"power1.out"}));
}

const WIZ_STEPS = ["welcome","earners","bills","goals","spending","plan","surplus","assets","done"];
/* income-based starter estimates so nobody faces a blank box (clearly editable) */
function suggestSpend(usage, income){
  income=Number(income)||0; const k=v=>Math.round(v/1000)*1000;
  if(usage==="heavy") return {card:k(income*0.35), other:0};
  if(usage==="mix")   return {card:k(income*0.20), other:k(income*0.15)};
  if(usage==="light") return {card:0, other:k(income*0.30)};
  return {card:0, other:0};
}

    document.getElementById("app").innerHTML = `<div class="wizwrap"><div style="display:flex;justify-content:flex-end;padding-top:16px">${themeBtnHTML()}</div>${body}</div>`;
    wireOnboarding(); requestAnimationFrame(animateOnboarding); return;
  }

  if(step==="earners"){
    const n = onb.earners;
    let fields="";
    for(let i=0;i<n;i++){
      const label = i===0 ? "Your monthly take-home" : (n===2 ? "Partner's monthly take-home" : "Earner "+(i+1)+" take-home");
      const val = (onb.draft.people[i] && onb.draft.people[i].amount) || "";
      fields += `<div class="editrow"><span class="k" style="flex:1">${label}</span>
        <input type="number" data-earner="${i}" value="${val}" placeholder="0"></div>`;
    }
    body = `
      <h2>How many of you are earning?</h2>
      <p class="lead">We'll add a take-home box for each.</p>
      <div class="numpick">
        ${[1,2,3].map(k=>`<button data-earners="${k}" aria-pressed="${n===k}">${k}</button>`).join("")}
      </div>
      <div style="margin-top:14px">${fields}</div>`;
  }

  else if(step==="bills"){
    body = `
      <h2>What do you pay every month, no matter what?</h2>
      <p class="lead">Rent, utilities, insurance, subscriptions. Keep these <b>off your credit card</b> — they're separate from card spend.</p>
      <p class="chiplbl">Tap to add, then fill the amount:</p>
      ${listEditorWiz("fixed","",{examples:["Rent","Electricity","Internet","Mobile","Insurance","Subscriptions","Maid / Help","Fuel"]})}`;
  }
  else if(step==="spending"){
    const income=sum(onb.draft.people), usage=onb.cardUsage;
    const opts=[
      {v:"heavy", t:"Mostly my credit cards", s:"Bills, shopping — almost everything goes on a card"},
      {v:"mix",   t:"A mix of cards, UPI & bank", s:"Some on cards, plenty on UPI / bank / cash"},
      {v:"light", t:"Mostly UPI, bank or cash", s:"I rarely use credit cards"},
    ];
    const chooser=`<div class="usagepick">${opts.map(o=>`<button type="button" class="usageopt${usage===o.v?' on':''}" data-usage="${o.v}">
        <span class="ut">${o.t}</span><span class="us">${o.s}</span></button>`).join("")}</div>`;
    let capture="";
    if(usage){
      const sug=suggestSpend(usage, income);
      if(usage==="light"){
        const v=onb.otherSpend!=null?onb.otherSpend:sug.other; onb.cardSpend=0; onb.otherSpend=v; onb.spendEst=v;
        capture=`<div class="grouplbl">Your everyday spending</div>
          <p class="lead" style="font-size:13.5px;margin:0 0 10px">Your spending is spread across UPI, bank and cash — so we can't read it from one card. Roughly how much do you spend a month, <b>not counting the fixed bills above</b>?</p>
          <div class="editrow"><span class="k" style="flex:1">Monthly spending — all methods</span><input type="number" id="spendOther" value="${v}"></div>
          <p class="note">We suggested ${compact(sug.other)} from your income — change it to match reality. This becomes the variable number your plan flexes around.</p>`;
      } else if(usage==="mix"){
        const c=onb.cardSpend!=null?onb.cardSpend:sug.card, o=onb.otherSpend!=null?onb.otherSpend:sug.other;
        onb.cardSpend=c; onb.otherSpend=o; onb.spendEst=c+o;
        capture=`<div class="grouplbl">Your monthly spending</div>
          <div class="editrow"><span class="k" style="flex:1">On credit cards</span><input type="number" id="spendCard" value="${c}"></div>
          <div class="editrow"><span class="k" style="flex:1">Other — UPI / bank / cash</span><input type="number" id="spendOther" value="${o}"></div>
          <div class="statline"><span class="k">Total everyday spend</span><span class="v mono" id="spendTotal">${inr(c+o)}</span></div>
          <p class="note">📄 Make it exact later: upload a few card statements in <b>Spending</b> and Arth replaces the card part with your real average.</p>`;
      } else {
        const c=onb.cardSpend!=null?onb.cardSpend:sug.card; onb.cardSpend=c; onb.otherSpend=0; onb.spendEst=c;
        capture=`<div class="grouplbl">Your monthly card bill</div>
          <p class="lead" style="font-size:13.5px;margin:0 0 10px">Since almost everything goes on your cards, your card bill basically <i>is</i> your spending. What's a typical month?</p>
          <div class="editrow"><span class="k" style="flex:1">Typical monthly card bill</span><input type="number" id="spendCard" value="${c}"></div>
          <p class="note">📄 Want it exact? After setup, upload your last 3–6 statements in <b>Spending</b> — Arth reads them on your device and replaces this with your real monthly average, then re-plans.</p>`;
      }
    }
    body = `
      <h2>How do you spend, month to month?</h2>
      <p class="lead">This is the one number that really moves each month, so let's read it the right way for you.${income>0?"":" <b>Tip: add your income first (Back) for smarter suggestions.</b>"}</p>
      ${chooser}
      ${capture}`;
  }
  else if(step==="plan"){
    const income=sum(onb.draft.people), fixedM=sum(onb.draft.fixed);
    if(onb.spendEst==null) onb.spendEst=Math.round(income*0.35);
    const plan=fundingPlan(income, fixedM, onb.spendEst, onb.draft.goals);
    if(!onb._planSeeded){ seedLockedFromPlan(plan); onb._planSeeded=true; }
    const planRows=plan.rows.length ? plan.rows.map(r=>`<div class="statline">
        <span class="k">${esc(r.name)}<small style="${r.status==='short'?'color:var(--clay)':''}">${r.status==='short'?'⚠ ':'✓ '}${esc(r.note)}</small></span>
        <span class="v mono">${inr(r.suggested)}/mo</span></div>`).join("")
      : `<p class="note">No goals added — you can still lock a retirement SIP below.</p>`;
    const fitsBox = plan.rows.length ? (plan.feasible
      ? `<div class="suggestbox">✓ Everything fits — with <b>${inr(plan.spare)}/mo</b> to spare, suggested toward long-term / retirement.</div>`
      : `<div class="suggestbox" style="background:var(--clay-soft);color:var(--clay)">⚠ Your goals together need <b>${inr(plan.totalRequired)}/mo</b> but you can lock about <b>${inr(plan.capacity)}/mo</b>. We funded the nearest-term goals first — trim a target or push a date to close the gap.</div>`) : "";
    body = `
      <h2>Here's a plan we'd suggest</h2>
      <p class="lead">Built from your income, bills, goals and the ${compact(onb.spendEst||0)}/mo you spend — here's how much to lock away each month, and where it falls short. Tweak anything.</p>
      <div class="statline"><span class="k">Monthly spending <small>from the previous step — go Back to change</small></span><span class="v mono">${inr(onb.spendEst||0)}</span></div>
      <div class="statline"><span class="k">Spare capacity to invest <small>income − bills − spending</small></span><span class="v mono">${inr(plan.capacity)}/mo</span></div>
      <div class="statline"><span class="k">Your goals together need</span><span class="v mono">${inr(plan.totalRequired)}/mo</span></div>
      ${fitsBox}
      <div class="grouplbl">Suggested monthly locks</div>
      ${planRows}
      <div class="grouplbl">What you'll actually lock <span style="text-transform:none;font-weight:500;letter-spacing:0">— edit freely</span></div>
      ${listEditorWiz("locked","",{kind:true})}
      <div class="btnrow" style="margin-top:10px">
        <button class="btn ghost" data-act="replan">↺ Re-apply suggested amounts</button>
        <button class="btn ghost" data-act="aiplan">✨ Get a realistic plan with AI</button>
      </div>
      ${aiPlanHTML()}`;
  }
  else if(step==="surplus"){
    const gp = onb.draft.surplus.goalsPct;
    body = `
      <h2>When money's left over, how should it split?</h2>
      <p class="lead">In good months, the leftover splits between building goals faster and a guilt-free Flex buffer. (You can always override this each month.)</p>
      <div class="rangewrap"><input type="range" id="onbGoals" min="0" max="100" step="5" value="${gp}"></div>
      <div class="rangeticks"><span>All to Flex buffer</span><span>All to Goals</span></div>
      <div class="statline" style="margin-top:12px"><span class="k">→ Goals</span><span class="v" id="gpv">${gp}%</span></div>
      <div class="statline"><span class="k">→ Flex buffer</span><span class="v" id="fpv">${100-gp}%</span></div>`;
  }
  else if(step==="assets"){
    body = `
      <h2>What do you own and owe?</h2>
      <p class="lead">Savings, investments, gold, and any loans. Powers your net worth. <b>Skip if you'd rather add it later.</b></p>
      ${listEditorWiz("assets","Assets",{cls:true, examples:["Savings account","Fixed deposit","Mutual funds","Stocks","EPF / PPF","Gold","Emergency fund"]})}
      <div style="height:8px"></div>
      ${listEditorWiz("liabilities","Loans / liabilities",{examples:["Home loan","Car loan","Personal loan","Credit card due"]})}`;
  }
  else if(step==="goals"){
    body = `
      <h2>What are you saving toward?</h2>
      <p class="lead">A car, a house, a child fund. Name, target, by-when. <b>Skippable.</b></p>
      ${goalEditorWiz()}`;
  }
  else if(step==="done"){
    body = `
      <div class="wizhead"><div class="glyph" aria-hidden="true">${brandMarkSVG()}</div>
      <h2 style="text-transform:none">You're all set.</h2>
      <p class="lead" style="text-align:center">Your plan is ready. Each month, you'll confirm your numbers, enter your card spend, and decide where the leftover goes.</p></div>`;
  }

  const nav = step==="welcome" ? "" : `
    <div class="stepnav">
      <button class="btn ghost" data-act="back">Back</button>
      <button class="btn primary" data-act="${step==='done'?'finish':'next'}">${step==='done'?'Open my dashboard':(['assets','goals'].includes(step)?'Continue / Skip':'Continue')}</button>
    </div>`;

  document.getElementById("app").innerHTML = `
    <div class="wizwrap">
      <div style="display:flex;justify-content:flex-end;padding-top:16px">${themeBtnHTML()}</div>
      <div class="stepcount">Step ${idx} of ${total-1}</div>
      <div class="progress"><span style="width:${pct}%"></span></div>
      <div class="step${step==='done'?'':' stepcard'}">${body}</div>
      ${nav}
    </div>`;
  wireOnboarding();
  requestAnimationFrame(animateOnboarding);
}

/* simplified list editor used inside the wizard (writes to onb.draft) */
function listEditorWiz(key,title,opts={}){
  const rows=(onb.draft[key]||[]).map((it,i)=>{
    const kindSel = opts.kind ? `<select data-wlist="${key}" data-i="${i}" data-f="kind">
      <option value="safe"${it.kind==="safe"?" selected":""}>safe</option>
      <option value="equity"${it.kind==="equity"?" selected":""}>equity</option></select>`:"";
    const clsSel = opts.cls ? `<select data-wlist="${key}" data-i="${i}" data-f="cls">
      ${["cash","equity","gold","property","other"].map(o=>`<option value="${o}"${it.cls===o?" selected":""}>${o}</option>`).join("")}</select>`:"";
    return `<div class="editrow">
      <input type="text" data-wlist="${key}" data-i="${i}" data-f="name" value="${esc(it.name)}" placeholder="Name">
      <input type="number" data-wlist="${key}" data-i="${i}" data-f="amount" value="${it.amount}" placeholder="0">
      ${kindSel}${clsSel}
      <button class="del" data-wdel="${key}" data-i="${i}" title="Remove">×</button></div>`;
  }).join("");
  const chips = (opts.examples&&opts.examples.length)
    ? `<div class="chips">${opts.examples.map(n=>`<button type="button" class="chip" data-chip="${key}" data-name="${esc(n)}">+ ${esc(n)}</button>`).join("")}</div>` : "";
  return `${title?`<div class="grouplbl">${title}</div>`:""}${chips}${rows}<button class="addbtn" data-wadd="${key}">+ Add row</button>`;
}
function goalEditorWiz(){
  const examples=["Emergency fund","Car","Home down payment","Travel","Child's education","Wedding","Gadget"];
  const chips=`<div class="chips">${examples.map(n=>`<button type="button" class="chip" data-chip="goals" data-name="${esc(n)}">+ ${esc(n)}</button>`).join("")}</div>`;
  const rows=(onb.draft.goals||[]).map((g,i)=>`
    <div class="editrow" style="flex-wrap:wrap">
      <input type="text" data-wlist="goals" data-i="${i}" data-f="name" value="${esc(g.name)}" placeholder="Goal">
      <input type="number" data-wlist="goals" data-i="${i}" data-f="target" value="${g.target}" placeholder="Target">
      <input type="date" data-wlist="goals" data-i="${i}" data-f="date" value="${g.date}">
      <select data-wlist="goals" data-i="${i}" data-f="bucket">
        <option value="safe"${g.bucket==="safe"?" selected":""}>safe</option>
        <option value="equity"${g.bucket==="equity"?" selected":""}>equity</option></select>
      <button class="del" data-wdel="goals" data-i="${i}" title="Remove">×</button></div>`).join("");
  return `${chips}${rows}<button class="addbtn" data-wadd="goals">+ Add goal</button>`;
}

function wireOnboarding(){
  const root=document.getElementById("app");
  const tb=root.querySelector("#themeBtn"); if(tb) tb.onclick=toggleTheme;
  root.querySelectorAll("[data-act]").forEach(b=>b.onclick=()=>{
    const a=b.dataset.act;
    if(a==="sample"){ exploreSample(); return; }
    if(a==="next"){ _onbDir=1; onb.step++; render(); return; }
    if(a==="back"){ _onbDir=-1; onb.step--; render(); return; }
    if(a==="finish"){ finishOnboarding(); return; }
    if(a==="replan"){ seedLockedFromPlan(fundingPlan(sum(onb.draft.people), sum(onb.draft.fixed), onb.spendEst, onb.draft.goals)); renderOnboarding(); return; }
    if(a==="aiplan"){ runAiPlan(onb.draft); return; }
  });
  // spending step — card-usage choice + spend capture
  root.querySelectorAll("[data-usage]").forEach(b=>b.onclick=()=>{
    onb.cardUsage=b.dataset.usage; onb.cardSpend=null; onb.otherSpend=null; onb._planSeeded=false; renderOnboarding();
  });
  const recomputeSpend=()=>{ const u=onb.cardUsage;
    onb.spendEst = u==="light" ? (onb.otherSpend||0) : u==="mix" ? ((onb.cardSpend||0)+(onb.otherSpend||0)) : (onb.cardSpend||0);
    onb._planSeeded=false;
    const tt=root.querySelector("#spendTotal"); if(tt) tt.textContent=inr((onb.cardSpend||0)+(onb.otherSpend||0)); };
  const sc=root.querySelector("#spendCard"); if(sc) sc.oninput=()=>{ onb.cardSpend=Math.max(0,Number(sc.value)||0); recomputeSpend(); };
  const so=root.querySelector("#spendOther"); if(so) so.oninput=()=>{ onb.otherSpend=Math.max(0,Number(so.value)||0); recomputeSpend(); };
  const ai=root.querySelector("#applyAi"); if(ai) ai.onclick=applyAiPlan;
  // earners count
  root.querySelectorAll("[data-earners]").forEach(b=>b.onclick=()=>{
    onb.earners=Number(b.dataset.earners);
    // resize people array
    const p=onb.draft.people;
    while(p.length<onb.earners) p.push({name:"Earner "+(p.length+1),amount:0});
    p.length=onb.earners;
    renderOnboarding();
  });
  root.querySelectorAll("[data-earner]").forEach(inp=>inp.oninput=()=>{
    const i=Number(inp.dataset.earner);
    if(!onb.draft.people[i]) onb.draft.people[i]={name:i===0?"You":"Earner "+(i+1),amount:0};
    onb.draft.people[i].amount=Number(inp.value)||0;
  });
  // surplus slider
  const gs=root.querySelector("#onbGoals");
  if(gs) gs.oninput=()=>{ const v=Number(gs.value)||0; onb.draft.surplus.goalsPct=v; onb.draft.surplus.flexPct=100-v;
    root.querySelector("#gpv").textContent=v+"%"; root.querySelector("#fpv").textContent=(100-v)+"%"; };
  // list editors
  root.querySelectorAll("[data-wlist]").forEach(inp=>inp.onchange=()=>{
    const {wlist,i,f}=inp.dataset;
    const val=(f==="amount"||f==="target"||f==="saved")?(Number(inp.value)||0):inp.value;
    onb.draft[wlist][Number(i)][f]=val;
    if(inp.tagName==="SELECT") renderOnboarding();
  });
  root.querySelectorAll("[data-wadd]").forEach(btn=>btn.onclick=()=>{
    const key=btn.dataset.wadd;
    const templ={ fixed:{name:"",amount:0}, locked:{name:"",amount:0,kind:"equity"},
      assets:{name:"",amount:0,cls:"cash"}, liabilities:{name:"",amount:0},
      goals:{name:"",target:100000,saved:0,date:isoIn(24),bucket:"safe"} }[key];
    onb.draft[key].push(structuredClone(templ)); renderOnboarding();
  });
  // example chips — add a prefilled row, user just fills the amount
  const ASSET_CLS={"Mutual funds":"equity","Stocks":"equity","EPF / PPF":"equity","Gold":"gold","Fixed deposit":"cash","Savings account":"cash","Emergency fund":"cash"};
  root.querySelectorAll("[data-chip]").forEach(b=>b.onclick=()=>{
    const key=b.dataset.chip, name=b.dataset.name;
    if((onb.draft[key]||[]).some(x=>String(x.name||"").toLowerCase()===name.toLowerCase())) return; // no dupes
    const templ={ fixed:{name,amount:0}, assets:{name,amount:0,cls:ASSET_CLS[name]||"cash"},
      liabilities:{name,amount:0}, goals:{name,target:100000,saved:0,date:isoIn(24),bucket:"safe"} }[key];
    onb.draft[key].push(structuredClone(templ)); renderOnboarding();
  });
  root.querySelectorAll("[data-wdel]").forEach(btn=>btn.onclick=()=>{
    onb.draft[btn.dataset.wdel].splice(Number(btn.dataset.i),1); renderOnboarding();
  });
}
function finishOnboarding(){
  state = onb.draft;
  // drop empty rows the user added but never filled
  ["fixed","locked","assets","liabilities","goals"].forEach(k=>{
    state[k]=(state[k]||[]).filter(x=>String(x.name||"").trim()!=="");
  });
  if(!state.people.length) state.people=[{name:"You",amount:0}];
  state.cardUsage = onb.cardUsage || null;
  migrate(state); activePeriod=currentMonthKey();
  if(onb.spendEst>0) setBill(currentMonthKey(), Math.round(onb.spendEst));   // seed the variable-spend so the plan is live from day one
  persist(); onb=null; route="app"; activeTab="home"; render(); toast("Your plan is ready");
}

/* compact Monarch-style cash-flow card for the current working month */
function cashflowSnapshot(){
  const m=computeMonth(billFor(activePeriod));
  const locked=alreadyRecorded(activePeriod);
  const chip = locked ? `<span class="srbadge good">✓ locked</span>` : `<span class="srbadge warn">in progress</span>`;
  if(m.income<=0){
    return `<section class="card">
      <div class="srrow"><span class="eyebrow">This month · ${periodLabel(activePeriod)}</span>${chip}</div>
      <p class="note" style="margin-top:10px">Add your take-home in <a href="#" data-go="settings" style="color:var(--accent)">Settings</a>, then run your first month in <a href="#" data-go="plan" style="color:var(--accent)">Plan</a>.</p></section>`;
  }
  const leftRow = m.surplus>=0
    ? `<div class="statline"><span class="k" style="font-weight:600">Leftover</span><span class="v mono" style="color:var(--accent)">${inr(m.surplus)}</span></div>`
    : `<div class="statline"><span class="k" style="font-weight:600">Buffer drawdown</span><span class="v mono" style="color:var(--clay)">−${inr(m.deficit)}</span></div>`;
  return `<section class="card">
    <div class="srrow"><span class="eyebrow">This month · ${periodLabel(activePeriod)}</span>${chip}</div>
    <div style="margin-top:8px">
      <div class="statline"><span class="k">Income</span><span class="v mono">${inr(m.income)}</span></div>
      <div class="statline"><span class="k">→ Invested <small>locked first</small></span><span class="v mono">${inr(m.locked)}</span></div>
      <div class="statline"><span class="k">→ Fixed bills</span><span class="v mono">${inr(m.fixed)}</span></div>
      <div class="statline"><span class="k">→ Card spend <small>the only variable</small></span><span class="v mono">${inr(m.bill)}</span></div>
      ${leftRow}
    </div>
    <button class="btn primary" data-go="plan" style="width:100%;margin-top:14px">${locked?"Review this month's plan":"Run this month's plan"} →</button>
  </section>`;
}
/* top goals at a glance, links into Goals */
function goalsGlance(){
  const goals=(state.goals||[]); if(!goals.length) return "";
  const top=goals.map(g=>({g, m:monthsBetween(g.date), rem:Math.max(0,(Number(g.target)||0)-(Number(g.saved)||0))}))
    .filter(o=>o.rem>0).sort((a,b)=>a.m-b.m).slice(0,3);
  const rows=top.map(o=>{ const pct=o.g.target>0?Math.min(100,o.g.saved/o.g.target*100):0;
    return `<div class="goal" style="padding:11px 0">
      <div class="grow"><span class="gname">${esc(o.g.name)}</span><span class="gmeta">${o.m} mo left</span></div>
      <div class="gbar"><span style="width:${pct}%"></span></div>
      <div class="grow"><span class="gnote mono">${compact(o.g.saved)} of ${compact(o.g.target)}</span><span class="gnote">${Math.round(pct)}%</span></div></div>`;}).join("");
  const got=goalsOnTrackCount();
  return `<section class="card"><div class="srrow"><h2 style="margin:0">Goals</h2>
      <span class="gmeta">${got.ok}/${got.total} on track · <a href="#" data-go="goals" style="color:var(--accent)">View all</a></span></div>
    <div style="margin-top:6px">${rows||'<p class="note">All goals funded 🎉</p>'}</div></section>`;
}

/* ============================================================
   ACCOUNTS — the balance sheet (assets, pots, liabilities → net worth)
   ============================================================ */
function viewAccounts(){
  if(balanceMode) return viewBalances();
  const assets=state.assets||[], liabs=state.liabilities||[];
  const CLS=[["cash","Cash & savings"],["equity","Investments"],["gold","Gold"],["property","Property"],["other","Other assets"]];
  const a=sum(assets), l=sum(liabs), pots=savedPots(), nw=netWorthNow();
  const groups=CLS.map(([k,label])=>{
    const items=assets.filter(x=>(x.cls||"other")===k); if(!items.length) return "";
    const rows=items.map(x=>`<div class="statline"><span class="k">${esc(x.name)}${x.ef?' <span class="pill near" style="margin-left:6px">EF</span>':''}</span><span class="v mono">${inr(x.amount)}</span></div>`).join("");
    return `<div class="acctgroup"><div class="acctgrouphd"><span>${label}</span><span class="mono">${inr(sum(items))}</span></div>${rows}</div>`;
  }).join("");
  const potItems=(state.goals||[]).filter(g=>(Number(g.saved)||0)>0).map(g=>`<div class="statline"><span class="k">${esc(g.name)} <small>goal pot</small></span><span class="v mono">${inr(g.saved)}</span></div>`).join("")
    + ((Number(state.flexBuffer)||0)>0?`<div class="statline"><span class="k">Flex buffer <small>your shock absorber</small></span><span class="v mono">${inr(state.flexBuffer)}</span></div>`:"");
  const potsGroup = pots>0 ? `<div class="acctgroup"><div class="acctgrouphd"><span>Savings pots</span><span class="mono">${inr(pots)}</span></div>${potItems}</div>` : "";
  const liabGroup = liabs.length ? `<div class="acctgroup"><div class="acctgrouphd"><span>Liabilities</span><span class="mono" style="color:var(--clay)">−${inr(l)}</span></div>${liabs.map(x=>`<div class="statline"><span class="k">${esc(x.name)}</span><span class="v mono" style="color:var(--clay)">−${inr(x.amount)}</span></div>`).join("")}</div>` : "";
  const empty = !assets.length && !liabs.length && pots<=0;
  const mix={}; assets.forEach(x=>{ mix[x.cls||"other"]=(mix[x.cls||"other"]||0)+(Number(x.amount)||0); });
  const mixRows=Object.keys(mix).map(k=>{ const p=a>0?mix[k]/a*100:0;
    return `<div class="tier"><div class="toprow"><span class="name" style="text-transform:capitalize">${esc(k)}</span><span class="amt mono">${p.toFixed(0)}% · ${compact(mix[k])}</span></div>
      <div class="bar"><span class="fill-teal" style="width:${p}%"></span></div></div>`; }).join("");
  const fixedMonthly=sum(state.fixed), ef=emergencyFund().amount||0, efMonths=fixedMonthly>0?ef/fixedMonthly:0;
  return `

        : `${groups}${potsGroup}${liabGroup}

/* Investments — returns + allocation over market-linked assets (equity/gold).
   Cost basis (asset.invested) is optional; shown as returns when present. No double-counting: reads existing assets. */
function investmentsCard(){
  const inv=(state.assets||[]).filter(a=>["equity","gold"].includes(a.cls||""));
  if(!inv.length) return "";
  const totVal=inv.reduce((a,x)=>a+(Number(x.amount)||0),0);
  const totInv=inv.reduce((a,x)=>a+(Number(x.invested)||0),0);
  const haveCost=inv.some(x=>Number(x.invested)>0);
  const gain=totVal-totInv, gainPct=totInv>0?gain/totInv*100:0;
  const rows=inv.map(x=>{ const v=Number(x.amount)||0, c=Number(x.invested)||0, g=v-c, gp=c>0?g/c*100:0, alloc=totVal>0?v/totVal*100:0;
    return `<div class="goal" style="padding:11px 0">
      <div class="grow"><span class="gname">${esc(x.name)} <span class="pill ${x.cls==="gold"?"near":"long"}">${esc(x.cls)}</span></span><span class="gmeta">${alloc.toFixed(0)}% of portfolio</span></div>
      <div class="gbar"><span style="width:${alloc}%"></span></div>

        <span class="gnote" style="color:${c>0?(g>=0?"var(--accent)":"var(--clay)"):"var(--ink-faint)"}">${c>0?`${g>=0?"+":""}${compact(g)} · ${gp>=0?"+":""}${gp.toFixed(1)}%`:"add cost in Settings for returns"}</span></div></div>`; }).join("");
  return `<section class="card"><h2>Investments${haveCost?` <span class="hint">— ${gainPct>=0?"+":""}${gainPct.toFixed(1)}% overall</span>`:""}</h2>
    <div class="bignum mono">${compact(totVal)}</div>
    <div class="subnum">${haveCost?`${inr(totInv)} invested · <b style="color:${gain>=0?"var(--accent)":"var(--clay)"}">${gain>=0?"+":""}${inr(gain)}</b> gain`:`across ${inv.length} holding${inv.length>1?"s":""} · add cost in Settings to see returns`}</div>

}

/* ============================================================

function alreadyRecorded(period){ const k=period||activePeriod; return (state.history||[]).some(h=>h.key===k); }

function ensureAlloc(){
  const m=computeMonth(billFor(activePeriod));
  if(m.surplus<=0){ alloc=null; return; }
  if(!alloc){
    const s=suggestDestination();
    const surplus=Math.round(m.surplus);
    if(s.dest==="buffer"){ alloc=[{dest:"buffer", amount:surplus}]; }
    else {
      // split per the user's Goals%/Flex% setting: top suggestion gets goals%, rest to buffer
      const gp=Math.min(100,Math.max(0,Number(state.surplus&&state.surplus.goalsPct)||0));
      const toMain=Math.round(surplus*gp/100), toBuf=surplus-toMain;
      alloc=[{dest:s.dest, amount:toMain}];
      if(toBuf>0) alloc.push({dest:"buffer", amount:toBuf});
    }
  }
}

          </div>
          ${state.spending&&state.spending[activePeriod]&&state.spending[activePeriod].total
            ? `<p class="note" style="margin-top:4px">📄 From your statements: <b class="mono">${inr(state.spending[activePeriod].total)}</b> · <a href="#" data-go="spending" style="color:var(--accent)">review &amp; categorise</a></p>`

function allocCard(m){
  ensureAlloc();
  if(!alloc) return "";                 // no positive surplus to allocate
  const s=suggestDestination();
  const opts=allocOptions();
  const allocated = alloc.reduce((a,r)=>a+(Number(r.amount)||0),0);
  const remaining = Math.round(m.surplus - allocated);
  const rows = alloc.map((r,i)=>`
    <div class="alloc-row">
      <select data-alloc-dest="${i}">
        ${opts.map(o=>`<option value="${o.v}"${o.v===r.dest?" selected":""}>${esc(o.t)}</option>`).join("")}
      </select>
      <input type="number" data-alloc-amt="${i}" value="${Math.round(r.amount)}">
      <button class="del" data-alloc-del="${i}" title="Remove">×</button>
    </div>`).join("");
  return `
    <section class="card"><h2>Where should the ₹${Math.round(m.surplus).toLocaleString("en-IN")} go? <span class="hint">— split it any way you like</span></h2>
      <div class="suggestbox">💡 Suggested: send it to <b>${esc(s.label)}</b>. Change it below however you want.</div>
      ${rows}
      <button class="addbtn" id="allocAdd">+ Add another destination</button>
      <div class="alloc-remaining">
        <span>${remaining===0?'Fully allocated ✅':(remaining>0?'Remaining (rolls into Flex buffer):':'Over-allocated — trim a row:')}</span>
        <b class="mono" style="color:${remaining<0?'var(--clay)':'var(--ink)'}">${inr(Math.abs(remaining))}</b>
      </div>
    </section>`;
}

function goalsOnTrackCount(){
  const goals=state.goals||[]; let ok=0;
  const lockedM=sum(state.locked);
  goals.forEach(g=>{
    const months=monthsBetween(g.date); const rem=Math.max(0,(g.target||0)-(g.saved||0));
    if(rem<=0){ ok++; return; }        // already funded
    if(months<=0) return;              // overdue — not on track
    if(rem/months<=lockedM) ok++;      // comfortably fundable from current locked saving
  });
  return {ok, total:goals.length};
}

function recentMonths(){
  if(!state.history.length) return `<p class="note" style="margin-top:10px">No months recorded yet.</p>`;
  const rows = state.history.slice(-6).reverse().map(h=>{
    const tag = h.surplus>=0 ? `<span class="mono" style="color:var(--teal)">+${inr(h.surplus)}</span>`
                             : `<span class="mono" style="color:var(--clay)">−${inr(h.deficit)}</span>`;
    return `<div class="statline"><span class="k">${esc(h.label)}<small>bill ${inr(h.bill)}</small></span><span class="v">${tag}</span></div>`;
  }).join("");
  return `<div style="margin-top:6px">${rows}</div>`;
}

function lockInMonth(){
  if(alreadyRecorded(activePeriod)) return;                 // guard against double-record
  const m=computeMonth(billFor(activePeriod));
  const applied=[];                                          // record real deltas so reopen can reverse them
  if(m.surplus>=0){
    ensureAlloc();
    let allocated=0;
    alloc.forEach(r=>{
      const amt=Number(r.amount)||0; if(amt<=0) return; allocated+=amt;
      const delta=applyAllocation(r.dest, amt); if(delta) applied.push({dest:r.dest, amt:delta});
    });
    const leftover=Math.max(0, m.surplus-allocated);
    if(leftover>0){ state.flexBuffer += leftover; applied.push({dest:"buffer", amt:leftover}); }
  } else {
    const draw=Math.min(Number(state.flexBuffer)||0, m.deficit);
    state.flexBuffer = Math.max(0, state.flexBuffer - m.deficit);
    if(draw) applied.push({dest:"buffer", amt:-draw});       // negative = drawdown
  }
  const nwNow = netWorthNow();                              // after allocations applied (incl. saved pots)
  const saved = m.income - m.fixed - m.bill;                // locked + leftover kept
  state.history.push({
    key: activePeriod, label: periodLabel(activePeriod),
    bill:m.bill, surplus:Math.max(0,m.surplus), deficit:m.deficit,
    income:m.income, fixed:m.fixed, locked:m.locked, spend:m.bill,
    saved:Math.round(saved), savingsRate: m.income>0 ? saved/m.income : 0,
    netWorth: Math.round(nwNow), buffer: Math.round(state.flexBuffer), applied
  });
  state.history.sort((a,b)=>a.key<b.key?-1:1);              // keep chronological for trends
  alloc=null; ritual={salary:false,locked:false,bills:false};
  persist(); render();
  toast(`${periodLabel(activePeriod)} locked in`);
}
/* applies an allocation and returns the REAL amount moved (after caps/floors) */
function applyAllocation(dest, amt){
  if(dest==="buffer"){ state.flexBuffer += amt; return amt; }
  if(dest==="ef"){ const ef=emergencyFund(); if(ef && ef.amount!=null){ ef.amount=(Number(ef.amount)||0)+amt; return amt; } return 0; }
  if(dest.startsWith("goal:")){ const g=state.goals[Number(dest.slice(5))]; if(g){ const b=Number(g.saved)||0; g.saved=Math.min(Number(g.target)||Infinity, b+amt); return g.saved-b; } return 0; }
  if(dest.startsWith("liab:")){ const l=state.liabilities[Number(dest.slice(5))]; if(l){ const b=Number(l.amount)||0; l.amount=Math.max(0, b-amt); return b-l.amount; } return 0; }
  return 0;
}
/* reverse the saved allocations and drop the record — fixes reopen double-apply */
function reverseAllocation(dest, amt){
  if(dest==="buffer"){ state.flexBuffer = Math.max(0, (Number(state.flexBuffer)||0) - amt); return; }
  if(dest==="ef"){ const ef=emergencyFund(); if(ef && ef.amount!=null) ef.amount=Math.max(0,(Number(ef.amount)||0)-amt); return; }
  if(dest.startsWith("goal:")){ const g=state.goals[Number(dest.slice(5))]; if(g) g.saved=Math.max(0,(Number(g.saved)||0)-amt); return; }
  if(dest.startsWith("liab:")){ const l=state.liabilities[Number(dest.slice(5))]; if(l) l.amount=(Number(l.amount)||0)+amt; return; }
}
function reopenMonth(period){
  const idx=(state.history||[]).findIndex(h=>h.key===period);
  if(idx<0) return;
  ((state.history[idx].applied)||[]).slice().reverse().forEach(a=>reverseAllocation(a.dest, a.amt));
  state.history.splice(idx,1);
}

const CAT_COLORS={
  "Food & Dining":"#B1442F","Travel & Transport":"#5E7AA0","Groceries":"#2F7A6E",
  "Shopping":"#B5791F","Bills & Subscriptions":"#7C6F86","Health":"#3a8f7f",
  "Entertainment":"#9a6b3f","Payment / Transfer":"#8B9A96","Other":"#A9B4B0"};
function catColor(c){ return CAT_COLORS[c] || "#6f8a85"; }
let _donutFocus = null;   // category name to highlight in the spending donut
function donutChart(cats){
  const total=cats.reduce((a,c)=>a+c.amount,0)||1;
  const focus=_donutFocus && cats.some(c=>c.category===_donutFocus) ? _donutFocus : null;
  const r=52, C=2*Math.PI*r; let off=0;
