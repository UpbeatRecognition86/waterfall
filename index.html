/* ============================================================
   GOALS
   ============================================================ */
function viewGoals(){
  const lockedM = sum(state.locked);
  const goals = (state.goals||[]).map(g=>{
    const months = monthsBetween(g.date);
    const remaining = Math.max(0, (Number(g.target)||0)-(Number(g.saved)||0));
    const pct = g.target>0 ? Math.min(100,(g.saved/g.target*100)) : 0;
    const funded = remaining<=0;
    const overdue = months<=0 && !funded;
    const needed = overdue ? 0 : (months>0 ? remaining/months : remaining);
    let cls="long", lbl="long-term";
    if(overdue){ cls="near"; lbl="⚠ date passed"; }
    else if(funded){ cls="long"; lbl="funded ✓"; }
    else if(months<=36){ cls="near"; lbl="near-term · keep it safe"; }
    else if(months<=84){ cls="mid"; lbl="medium-term"; }
    const bucketNote = g.bucket==="equity" ? "equity-backed" : "safe / liquid";
    return `<div class="goal">
      <div class="grow"><span class="gname">${esc(g.name)} <span class="pill ${cls}">${lbl}</span></span>
        <span class="gmeta">${overdue?"overdue":months+" mo left"} · ${esc(bucketNote)}</span></div>
      <div class="gbar"><span style="width:${pct}%"></span></div>
      <div class="grow"><span class="gnote mono">${inr(g.saved)} of ${inr(g.target)} · ${Math.round(pct)}%</span>
        <span class="gnote">${funded?"complete":overdue?"set a new date":`needs <b class="mono">${inr(needed)}</b>/mo`}</span></div></div>`;
  }).join("");
  const totalNeeded = (state.goals||[]).reduce((a,g)=>{
    const months=monthsBetween(g.date); const rem=Math.max(0,(g.target||0)-(g.saved||0));
    return a + (months>0?rem/months:rem);
  },0);
  const income=sum(state.people), fixedM=sum(state.fixed), est=billFor(currentMonthKey());
  const plan=fundingPlan(income, fixedM, est, state.goals);
  const planRows=plan.rows.map(r=>`<div class="statline">
      <span class="k">${esc(r.name)}<small style="${r.status==='short'?'color:var(--clay)':''}">${r.status==='short'?'⚠ ':'✓ '}${esc(r.note)}</small></span>
      <span class="v mono">${inr(r.suggested)}/mo</span></div>`).join("");
  const planCard = (state.goals&&state.goals.length) ? `
    <section class="card"><h2>Suggested funding plan <span class="hint">— at a ${compact(est)} spend month</span></h2>
      ${plan.feasible
        ? `<div class="suggestbox">✓ Your goals fit your spare capacity, with <b>${inr(plan.spare)}/mo</b> over for long-term/retirement.</div>`
        : `<div class="suggestbox" style="background:var(--clay-soft);color:var(--clay)">⚠ Goals need <b>${inr(plan.totalRequired)}/mo</b> but spare capacity is <b>${inr(plan.capacity)}/mo</b>. Nearest-term goals funded first.</div>`}
      ${planRows}
      <div class="statline"><span class="k">Spare capacity (income − bills − spend)</span><span class="v mono">${inr(plan.capacity)}/mo</span></div>
      <p class="note" style="margin-top:8px">This recomputes as your spending changes. A goal flagged ⚠ won't hit its date at the funded rate — trim the target, push the date, or spend less.</p>
      <button class="btn ghost" id="aiPlanBtn" style="margin-top:10px">✨ Get a realistic plan with AI</button>
      ${aiPlanHTML()}</section>` : "";
  return `
    <section class="card"><h2>Goals <span class="hint">— ordered by what you'll need soonest</span></h2>
      ${goals||'<p class="note">No goals yet. Add them in Settings.</p>'}</section>
    ${planCard}`;
}

/* ============================================================
   BIG BUY
   ============================================================ */
function viewCar(){
  const c=state.car; const price=Number(c.price)||0; const tax=(Number(c.marginalTaxPct)||0)/100;
  const cash={ upfront:price, monthly:0, liquidityHit:price, total:price };
  const down=price*(Number(c.downPct)||0)/100; const principal=price-down;
  const r=(Number(c.loanRatePct)||0)/100/12, n=(Number(c.loanYears)||1)*12;
  const emi = r>0 ? principal*r*Math.pow(1+r,n)/(Math.pow(1+r,n)-1) : principal/n;
  const loanTotal = down + emi*n;
  const loan={ upfront:down, monthly:emi, liquidityHit:down, total:loanTotal };
  const leaseM=Number(c.leaseMonthly)||0, perq=Number(c.perqMonthly)||0;
  const effLeaseMonthly = leaseM*(1-tax) + perq*tax;
  const leaseYears=(Number(c.loanYears)||1); const leaseTotal=effLeaseMonthly*leaseYears*12;
  const lease={ upfront:0, monthly:effLeaseMonthly, liquidityHit:0, total:leaseTotal };
  const rows=[
    {key:"Pay cash", o:cash, note:"You own it outright. But it drains liquidity for other goals."},
    {key:"Car loan", o:loan, note:"Keeps most cash free. Cheapest to exit — no job lock-in."},
    {key:"Company lease", o:lease, note:"Tax-efficient & no upfront cash, but tied to your job. Leaving early can force a costly buyout."}
  ];
  const winnerRow = rows.reduce((best,x)=>{
    if(x.o.liquidityHit < best.o.liquidityHit) return x;
    if(x.o.liquidityHit === best.o.liquidityHit && x.o.total < best.o.total) return x;
    return best;
  });
  const winner=winnerRow.key;
  const body=rows.map(row=>{
    const win=row.key===winner;
    return `<tr class="${win?'win':''}">
      <td>${row.key} ${win?'<span class="winbadge">↳ best for liquidity</span>':''}</td>
      <td class="num">${inr(row.o.upfront)}</td>
      <td class="num">${row.o.monthly?inr(row.o.monthly):'—'}</td>
      <td class="num">${row.o.liquidityHit?inr(row.o.liquidityHit):'₹0'}</td></tr>`;
  }).join("");
  return `
    <section class="card"><h2>Big buy — lease vs loan vs cash</h2>
      <p class="note" style="margin-top:-4px;margin-bottom:14px">Comparing a <b class="mono">${inr(price)}</b> car three ways. Edit any input below.</p>
      <table class="cmp"><thead><tr><th>Option</th><th>Upfront</th><th>Monthly</th><th>Cash locked</th></tr></thead>
        <tbody>${body}</tbody></table>
      <p class="note" style="margin-top:12px">${rows.map(r=>`<b>${r.key}:</b> ${r.note}`).join("<br>")}</p></section>
    <section class="card"><h2>Inputs</h2>
      <div class="editrow"><span class="k" style="flex:1">Car price</span><input type="number" data-car="price" value="${price}"></div>
      <div class="editrow"><span class="k" style="flex:1">Your marginal tax %</span><input type="number" data-car="marginalTaxPct" value="${c.marginalTaxPct}"></div>
      <div class="grouplbl">Loan</div>
      <div class="editrow"><span class="k" style="flex:1">Down payment %</span><input type="number" data-car="downPct" value="${c.downPct}"></div>
      <div class="editrow"><span class="k" style="flex:1">Interest rate % p.a.</span><input type="number" step="0.1" data-car="loanRatePct" value="${c.loanRatePct}"></div>
      <div class="editrow"><span class="k" style="flex:1">Tenure (years)</span><input type="number" data-car="loanYears" value="${c.loanYears}"></div>
      <div class="grouplbl">Company lease</div>
      <div class="editrow"><span class="k" style="flex:1">Lease rental / month</span><input type="number" data-car="leaseMonthly" value="${c.leaseMonthly}"></div>
      <div class="editrow"><span class="k" style="flex:1">Taxable perquisite / month</span><input type="number" data-car="perqMonthly" value="${c.perqMonthly}"></div>
      <p class="note" style="margin-top:10px"><b>Not tax advice.</b> Check the foreclosure terms if you leave the job — that's the real risk.</p></section>`;
}

/* ============================================================
   SETTINGS
   ============================================================ */
function viewSettings(){
  const listEditor=(title,key,opts={})=>{
    const rows=(state[key]||[]).map((it,i)=>{
      const kindSel = opts.kind ? `<select data-list="${key}" data-i="${i}" data-f="kind">
        <option value="safe"${it.kind==="safe"?" selected":""}>safe</option>
        <option value="equity"${it.kind==="equity"?" selected":""}>equity</option></select>`:"";
      const clsSel = opts.cls ? `<select data-list="${key}" data-i="${i}" data-f="cls">
        ${["cash","equity","gold","property","other"].map(o=>`<option value="${o}"${it.cls===o?" selected":""}>${o}</option>`).join("")}</select>`:"";
      const efBtn = opts.ef ? `<button class="eftoggle${it.ef?' on':''}" data-ef="${i}" title="Mark as your emergency fund">${it.ef?'★':'☆'} EF</button>`:"";
      return `<div class="editrow" style="flex-wrap:wrap">
        <input type="text" data-list="${key}" data-i="${i}" data-f="name" value="${esc(it.name)}" placeholder="Name">
        <input type="number" data-list="${key}" data-i="${i}" data-f="amount" value="${it.amount}" placeholder="0">
        ${kindSel}${clsSel}${efBtn}
        <button class="del" data-del="${key}" data-i="${i}" title="Remove">×</button></div>`;
    }).join("");
    return `<div class="grouplbl">${title}</div>${rows}<button class="addbtn" data-add="${key}">+ Add row</button>`;
  };
  const goalRows=(state.goals||[]).map((g,i)=>`
    <div class="editrow" style="flex-wrap:wrap">
      <input type="text" data-list="goals" data-i="${i}" data-f="name" value="${esc(g.name)}" placeholder="Goal">
      <input type="number" data-list="goals" data-i="${i}" data-f="target" value="${g.target}" placeholder="Target" title="Target">
      <input type="number" data-list="goals" data-i="${i}" data-f="saved" value="${g.saved}" placeholder="Saved" title="Saved so far">
      <input type="date" data-list="goals" data-i="${i}" data-f="date" value="${g.date}" title="Target date">
      <select data-list="goals" data-i="${i}" data-f="bucket">
        <option value="safe"${g.bucket==="safe"?" selected":""}>safe</option>
        <option value="equity"${g.bucket==="equity"?" selected":""}>equity</option></select>
      <button class="del" data-del="goals" data-i="${i}" title="Remove">×</button></div>`).join("");
  return `
    <div class="privacy"><span class="dot" aria-hidden="true"></span>
      <p><b>Everything stays on this device.</b> Saved only in this browser; statement parsing runs locally. The optional <b>AI advisor</b> is the one feature that sends a summary of your finances out (to Anthropic, only when you tap it). Use Export to back up or move your data.</p></div>
    <section class="card"><h2>Income — monthly take-home</h2>${listEditor("Earners","people")}</section>
    <section class="card"><h2>Fixed bills</h2>${listEditor("Paid every month","fixed")}</section>
    <section class="card"><h2>Locked investments <span class="hint">— debited first</span></h2>${listEditor("Auto-debit on salary day","locked",{kind:true})}</section>
    <section class="card"><h2>Surplus split <span class="hint">— starting hint for each month's suggestion</span></h2>
      <div class="editrow"><span class="k" style="flex:1">→ Goals %</span><input type="number" id="goalsPct" value="${state.surplus.goalsPct}"></div>
      <div class="editrow"><span class="k" style="flex:1">→ Flex (buffer) %</span><input type="number" id="flexPct" value="${state.surplus.flexPct}"></div>
      <p class="note">Sets how each month's leftover is split by default — your top goal vs the Flex buffer. You can still override the split every month. The two add to 100.</p></section>
    <section class="card"><h2>Assets <span class="hint">— ★ marks your emergency fund</span></h2>${listEditor("What you own","assets",{cls:true,ef:true})}</section>
    <section class="card"><h2>Liabilities</h2>${listEditor("What you owe","liabilities")}</section>
    <section class="card"><h2>Goals</h2>${goalRows}<button class="addbtn" data-add="goals">+ Add goal</button></section>
    <section class="card"><h2>AI insights <span class="hint">— optional, bring your own key</span></h2>
      <div class="editrow"><span class="k" style="flex:1">Anthropic API key</span>
        <input type="password" id="aiKey" placeholder="${getAiKey()?'•••• saved — paste to replace':'sk-ant-…'}"></div>
      <p class="note">Stored only on this device and <b>never included in exports</b>. When you tap an AI button, a summary of your finances is sent to Anthropic's API using this key (~2¢ per plan). Get a key at <b>console.anthropic.com</b>. This is a personal/testing setup — for public users this moves behind a server so they don't need a key.</p>
      ${getAiKey()?`<button class="btn ghost" id="clearAiKey" style="color:var(--clay)">Remove key</button>`:""}</section>
    <section class="card"><h2>Your data</h2>
      <div class="btnrow">
        <button class="btn ghost" id="exportBtn">Export backup (.json)</button>
        <button class="btn ghost" id="importBtn">Import backup</button>
        <input type="file" id="importFile" accept="application/json" style="display:none">
        <button class="btn ghost" id="sampleBtn">Reset to sample</button>
        <button class="btn ghost" id="clearBtn" style="color:var(--clay)">Clear everything</button>
      </div>
      <p class="note" style="margin-top:12px">${hasStorage?"Saved automatically in this browser.":"⚠ This browser blocks local storage — data lasts only this session. Export to keep it."}</p></section>`;
}

/* ============================================================
   WIRING — app
   ============================================================ */
function wireApp(){
  const root=document.getElementById("app");
  const tb=root.querySelector('#themeBtn'); if(tb) tb.onclick=toggleTheme;
  const ps=root.querySelector('#periodSel'); if(ps) ps.onchange=()=>{ activePeriod=ps.value; alloc=null; _donutFocus=null; render(); window.scrollTo(0,0); };
  root.querySelectorAll('.bottomnav [data-tab]').forEach(b=>b.onclick=()=>{ activeTab=b.dataset.tab; render(); window.scrollTo(0,0); });
  root.querySelectorAll('[data-go]').forEach(b=>b.onclick=(e)=>{ e.preventDefault(); activeTab=b.dataset.go; render(); });

  // ritual ticks
  root.querySelectorAll('[data-tick]').forEach(b=>b.onclick=()=>{ ritual[b.dataset.tick]=!ritual[b.dataset.tick]; render(); });
  root.querySelectorAll('[data-ritual-earner]').forEach(inp=>inp.onchange=()=>{
    const i=Number(inp.dataset.ritualEarner); state.people[i].amount=Number(inp.value)||0; persist(); render(); });
  root.querySelectorAll('[data-ritual-locked]').forEach(inp=>inp.onchange=()=>{
    state.locked[Number(inp.dataset.ritualLocked)].amount=Number(inp.value)||0; persist(); render(); });
  root.querySelectorAll('[data-ritual-fixed]').forEach(inp=>inp.onchange=()=>{
    state.fixed[Number(inp.dataset.ritualFixed)].amount=Number(inp.value)||0; persist(); render(); });

  // card bill
  const bn=root.querySelector('#billn');
  if(bn){ bn.onchange=()=>{ setBill(activePeriod, bn.value); alloc=null; persist(); render(); }; }

  // allocation
  root.querySelectorAll('[data-alloc-dest]').forEach(sel=>sel.onchange=()=>{ alloc[Number(sel.dataset.allocDest)].dest=sel.value; render(); });
  root.querySelectorAll('[data-alloc-amt]').forEach(inp=>inp.onchange=()=>{ alloc[Number(inp.dataset.allocAmt)].amount=Number(inp.value)||0; render(); });
  root.querySelectorAll('[data-alloc-del]').forEach(b=>b.onclick=()=>{ alloc.splice(Number(b.dataset.allocDel),1); if(!alloc.length){const m=computeMonth(billFor(activePeriod)); alloc=[{dest:"buffer",amount:Math.round(Math.max(0,m.surplus))}];} render(); });
  const aa=root.querySelector('#allocAdd'); if(aa) aa.onclick=()=>{ alloc.push({dest:"buffer",amount:0}); render(); };

  // lock in / reopen
  const lb=root.querySelector('#lockBtn'); if(lb) lb.onclick=lockInMonth;
  const rb=root.querySelector('#reopenBtn'); if(rb) rb.onclick=()=>{
    if(confirm("Re-open "+periodLabel(activePeriod)+"? This removes the record so you can redo it.")){
      reopenMonth(activePeriod); persist(); render();
    }
  };

  // spending: upload
  const dz=root.querySelector('#dropzone'), sf=root.querySelector('#stmtFile');
  if(sf){
    if(dz) dz.onclick=()=>sf.click();
    sf.onchange=()=>{ if(sf.files&&sf.files.length) handleStatements(sf.files); };
    if(dz){ dz.ondragover=e=>{e.preventDefault(); dz.style.borderColor='var(--accent)';};
      dz.ondragleave=()=>{dz.style.borderColor='';};
      dz.ondrop=e=>{e.preventDefault(); dz.style.borderColor=''; if(e.dataTransfer.files.length) handleStatements(e.dataTransfer.files);}; }
  }
  const addMore=root.querySelector('#addMore'); if(addMore&&sf) addMore.onclick=()=>sf.click();
  root.querySelectorAll('[data-donut]').forEach(b=>b.onclick=()=>{ _donutFocus=(_donutFocus===b.dataset.donut)?null:b.dataset.donut; render(); });
  const tf=root.querySelector('#txnFilter'); if(tf) tf.onchange=()=>{ txnFilter=tf.value; render(); };
  root.querySelectorAll('[data-txncat]').forEach(sel=>sel.onchange=()=>{
    const t=state.spending[activePeriod].transactions[Number(sel.dataset.txncat)]; if(!t) return;
    t.category=sel.value; state.merchantMaster[WaterfallParser.merchantKey(t.merchant)]=sel.value;
    persist(); render(); });
  const uab=root.querySelector('#useAsBill'); if(uab) uab.onclick=()=>{
    const sp=state.spending[activePeriod]; if(sp) setBill(activePeriod, Math.round(sp.total)); alloc=null; persist();
    activeTab='home'; render(); toast("Card spend set from statements"); };
  const cs=root.querySelector('#clearSpend'); if(cs) cs.onclick=()=>{
    if(confirm("Clear "+periodLabel(activePeriod)+"'s uploaded statements?")){ delete state.spending[activePeriod]; persist(); render(); } };

  // AI plan (Goals tab)
  const aiPlanBtn=root.querySelector('#aiPlanBtn'); if(aiPlanBtn) aiPlanBtn.onclick=()=>runAiPlan(state);
  const applyAiBtn=root.querySelector('#applyAi'); if(applyAiBtn) applyAiBtn.onclick=applyAiPlan;
  // AI key (Settings)
  const aiKey=root.querySelector('#aiKey'); if(aiKey) aiKey.onchange=()=>{ const v=aiKey.value.trim(); if(v){ setAiKey(v); render(); toast('Key saved on this device'); } };
  const clrAi=root.querySelector('#clearAiKey'); if(clrAi) clrAi.onclick=()=>{ setAiKey(''); render(); toast('Key removed'); };

  // settings list editors
  root.querySelectorAll('[data-list]').forEach(inp=>inp.onchange=()=>{
    const {list,i,f}=inp.dataset;
    const val=(f==="amount"||f==="target"||f==="saved")?(Number(inp.value)||0):inp.value;
    state[list][Number(i)][f]=val; persist(); if(inp.tagName==="SELECT") render(); });
  root.querySelectorAll('[data-add]').forEach(btn=>btn.onclick=()=>{
    const key=btn.dataset.add;
    const templ={ people:{name:"New earner",amount:0}, fixed:{name:"New bill",amount:0},
      locked:{name:"New investment",amount:0,kind:"equity"}, assets:{name:"New asset",amount:0,cls:"cash"},
      liabilities:{name:"New liability",amount:0}, goals:{name:"New goal",target:100000,saved:0,date:isoIn(24),bucket:"safe"} }[key];
    state[key].push(structuredClone(templ)); persist(); render(); });
  root.querySelectorAll('[data-del]').forEach(btn=>btn.onclick=()=>{ state[btn.dataset.del].splice(Number(btn.dataset.i),1); persist(); render(); });
  root.querySelectorAll('[data-ef]').forEach(btn=>btn.onclick=()=>{
    const i=Number(btn.dataset.ef), on=!state.assets[i].ef;
    state.assets.forEach(a=>delete a.ef); if(on) state.assets[i].ef=true; persist(); render(); });
  const gp=root.querySelector('#goalsPct'), fp=root.querySelector('#flexPct');
  const clampPct=v=>Math.max(0,Math.min(100,Number(v)||0));
  if(gp) gp.onchange=()=>{ state.surplus.goalsPct=clampPct(gp.value); state.surplus.flexPct=100-state.surplus.goalsPct; persist(); render(); };
  if(fp) fp.onchange=()=>{ state.surplus.flexPct=clampPct(fp.value); state.surplus.goalsPct=100-state.surplus.flexPct; persist(); render(); };

  // data buttons
  const ex=root.querySelector('#exportBtn'); if(ex) ex.onclick=exportData;
  const im=root.querySelector('#importBtn'); const imf=root.querySelector('#importFile');
  if(im&&imf){ im.onclick=()=>imf.click(); imf.onchange=importData; }
  const sa=root.querySelector('#sampleBtn');
  if(sa) sa.onclick=()=>{ if(confirm("Replace everything with the sample couple's data?")){ state=structuredClone(SAMPLE); persist(); render(); toast("Reset to sample"); } };
  const cl=root.querySelector('#clearBtn');
  if(cl) cl.onclick=()=>{ if(confirm("Erase all your data from this browser? This cannot be undone.")){ state=null; persist_clear(); startOnboarding(); toast("Cleared"); } };
}
function persist_clear(){ if(hasStorage){ try{ localStorage.removeItem(STORAGE_KEY); }catch(e){} } else { memState=null; } }

function exportData(){
  const blob=new Blob([JSON.stringify(state,null,2)],{type:"application/json"});
  const url=URL.createObjectURL(blob); const a=document.createElement("a");
  a.href=url; a.download="waterfall-backup.json"; a.click(); URL.revokeObjectURL(url); toast("Backup downloaded");
}
function importData(e){
  const file=e.target.files[0]; if(!file) return;
  const r=new FileReader();
  r.onload=()=>{ try{ const data=JSON.parse(r.result);
      if(!data || typeof data!=="object" || !Array.isArray(data.people)) throw new Error("bad");
      state=migrate(data); route="app"; activePeriod=currentMonthKey(); persist(); render(); toast("Backup loaded");
    }catch(err){ alert("That doesn't look like a Waterfall backup file."); } };
  r.readAsText(file);
}

/* boot */
function boot(){
  applyTheme();
  if(window.matchMedia){ try{ matchMedia("(prefers-color-scheme:dark)").addEventListener("change",()=>{ if(!getThemePref()) render(); }); }catch(e){} }
  render();
}
if(document.readyState==="loading") document.addEventListener("DOMContentLoaded", boot); else boot();
</script>
</body>
</html>
